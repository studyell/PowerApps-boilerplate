                                                          PosW: dayW / Max(colN, 1),
                                                          PosY: (B.StartMin - gStartMin) / Max(gStepMin, 1) * gRowH,
                                                          PosH: (B.EndMin - B.StartMin) / Max(gStepMin, 1) * gRowH
