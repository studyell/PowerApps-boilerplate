                  Y: =44
            - btnRebuildWeek_UserCal:
                Control: Classic/Button@2.2.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =// ---- 週間表示のデータ再構築 ----
                    // 呼び出し元で gWeekStart を設定してから Select すること
                    Set(gWeekEnd, DateAdd(gWeekStart, 6, TimeUnit.Days));

                    // ---- その週の予約枠日マスタ（7日ぶんを範囲取得＝委任される）----
                    ClearCollect(
                        colWeekFrames,
                        ForAll(
                            Filter(予約枠日マスタ, SlotDate >= gWeekStart, SlotDate <= gWeekEnd) As D,
                            {
                                DayId: D.ID,
                                CellDate: Coalesce(D.SlotDate, Date(2000, 1, 1)),
                                FrameName: D.Title,
                                FrameType: Coalesce(D.FrameType, "時間単位"),
                                Category: D.Category,
                                SubCategory: D.SubCategory,
                                ColorR: Coalesce(D.ColorR, 126),
                                ColorG: Coalesce(D.ColorG, 199),
                                ColorB: Coalesce(D.ColorB, 216)
                            }
                        )
                    );

                    // ---- 日 × 枠のフラットな列リスト（1日あたり最大 gMaxCols 列）----
                    // Ungroup は使えないため、枠1行をそのまま1列として扱い、
                    // 同じ日の中での DayId 昇順の順位を列番号にする（§2.3）
                    ClearCollect(
                        colWeekCols,
                        With(
                            {
                                src: Filter(
                                    colWeekFrames,
                                    !IsBlank(varCatFilter),
                                    Category = varCatFilter,
                                    Not(IsEmpty(colSubCatSelected)),
                                    SubCategory in colSubCatSelected.SubCategoryName
                                )
                            },
                            Filter(
                                ForAll(
                                    src As F,
                                    {
                                        DayIdx: DateDiff(gWeekStart, F.CellDate, TimeUnit.Days) + 1,
                                        CellDate: F.CellDate,
                                        ColIdx: CountRows(Filter(src, CellDate = F.CellDate, DayId < F.DayId)) + 1,
                                        ColN: Min(gMaxCols, CountRows(Filter(src, CellDate = F.CellDate))),
                                        DayId: F.DayId,
                                        FrameName: F.FrameName,
                                        FrameType: F.FrameType,
                                        Category: F.Category,
                                        SubCategory: F.SubCategory,
                                        ColorR: F.ColorR,
                                        ColorG: F.ColorG,
                                        ColorB: F.ColorB
                                    }
                                ),
                                ColIdx <= gMaxCols
                            )
                        )
                    );

                    // ---- 日ヘッダー（7日ぶん。枠が無い日は列を出さない）----
                    ClearCollect(
                        colWeekDayView,
                        ForAll(
                            Sequence(7, 1) As D,
                            With(
                                {dDate: DateAdd(gWeekStart, D.Value - 1, TimeUnit.Days)},
                                With(
                                    {cols: Filter(colWeekCols, DayIdx = D.Value)},
                                    {
                                        DayIdx: D.Value,
                                        CellDate: dDate,
                                        DayName: Switch(
                                            Weekday(dDate),
                                            1, "日", 2, "月", 3, "火", 4, "水", 5, "木", 6, "金", 7, "土"
                                        ),
                                        ColN: Max(1, CountRows(cols)),
                                        HasCol: CountRows(cols) > 0,
                                        Sub1: LookUp(cols, ColIdx = 1, FrameName),
                                        Sub2: LookUp(cols, ColIdx = 2, FrameName),
                                        Sub3: LookUp(cols, ColIdx = 3, FrameName)
                                    }
                                )
                            )
                        )
                    );

                    // ---- 予約枠時間マスタ（DayId ごとに分割して取得＝1回あたりの取得数を抑える）----
                    // 先に1行入れて列の型を確定させてから空にする（§2.3）
                    ClearCollect(
                        colWeekSlots,
                        {
                            SlotId: 0,
                            DayId: 0,
                            DayIdx: 0,
                            ColIdx: 0,
                            CellDate: Today(),
                            FrameName: "",
                            FrameType: "",
                            Category: "",
                            SubCategory: "",
                            ColorR: 0,
                            ColorG: 0,
                            ColorB: 0,
                            StartTime: Now(),
                            EndTime: Now(),
                            StartMin: 0,
                            EndMin: 0,
                            Capacity: 0,
                            ReservedCount: 0,
                            PatternName: "",
                            ConfigJson: "",
                            PublishDate: Now(),
                            CloseDate: Today(),
                            EditLimitDate: Today(),
                            IsClosed: false
                        }
                    );
                    Clear(colWeekSlots);
                    ForAll(
                        colWeekCols As C,
                        Collect(
                            colWeekSlots,
                            ForAll(
                                Filter(予約枠時間マスタ, DayId = C.DayId) As S,
                                {
                                    SlotId: S.ID,
                                    DayId: C.DayId,
                                    DayIdx: C.DayIdx,
                                    ColIdx: C.ColIdx,
                                    CellDate: C.CellDate,
                                    FrameName: C.FrameName,
                                    FrameType: C.FrameType,
                                    Category: C.Category,
                                    SubCategory: C.SubCategory,
                                    ColorR: C.ColorR,
                                    ColorG: C.ColorG,
                                    ColorB: C.ColorB,
                                    StartTime: S.StartTime,
                                    EndTime: S.EndTime,
                                    StartMin: Hour(S.StartTime) * 60 + Minute(S.StartTime),
                                    EndMin: If(
                                        Hour(S.EndTime) * 60 + Minute(S.EndTime) <=
                                            Hour(S.StartTime) * 60 + Minute(S.StartTime),
                                        24 * 60,
                                        Hour(S.EndTime) * 60 + Minute(S.EndTime)
                                    ),
                                    Capacity: Coalesce(S.Capacity, 0),
                                    ReservedCount: Coalesce(S.ReservedCount, 0),
                                    PatternName: S.PatternName,
                                    ConfigJson: S.ConfigJson,
                                    PublishDate: S.PublishDate,
                                    CloseDate: DateAdd(C.CellDate, -Coalesce(S.CloseDaysBefore, 0), TimeUnit.Days),
                                    EditLimitDate: DateAdd(C.CellDate, -Coalesce(S.EditDaysBefore, 0), TimeUnit.Days),
                                    IsClosed: Today() >
                                        DateAdd(C.CellDate, -Coalesce(S.CloseDaysBefore, 0), TimeUnit.Days)
                                }
                            )
                        )
                    );


                    // ---- 休業日（その週の7日ぶん）----
                    ClearCollect(
                        colWeekHolidays,
                        ForAll(
                            Filter(休業日マスタ, HolidayDate >= gWeekStart, HolidayDate <= gWeekEnd) As H,
                            {
                                HolId: H.ID,
                                HolDate: Coalesce(H.HolidayDate, Date(2000, 1, 1)),
                                HolTitle: H.Title,
                                HolCat: H.Category,
                                HolSub: H.SubCategory,
                                HolActive: Coalesce(H.IsActive, true)
                            }
                        )
                    );
                    // ---- 日 × 列ごとに休業日を割り当てる（該当する列を丸ごと覆う）----
                    ClearCollect(
                        colWeekHolCells,
                        Filter(
                            ForAll(
                                Sequence(7 * gMaxCols, 0) As G,
                                With(
                                    {
                                        dIdx: RoundDown(G.Value / Max(gMaxCols, 1), 0) + 1,
                                        cIdx: Mod(G.Value, Max(gMaxCols, 1)) + 1
                                    },
                                    With(
                                        {
                                            dDate: DateAdd(gWeekStart, dIdx - 1, TimeUnit.Days),
                                            colN: Max(1, Coalesce(LookUp(colWeekDayView, DayIdx = dIdx, ColN), 1)),
                                            sub: LookUp(colWeekCols, DayIdx = dIdx && ColIdx = cIdx, SubCategory)
                                        },
                                        With(
                                            {
                                                h: LookUp(
                                                    colWeekHolidays,
                                                    HolActive && HolDate = dDate &&
                                                        (IsBlank(HolCat) || HolCat = varCatFilter) &&
                                                        (IsBlank(HolSub) || HolSub = sub)
                                                )
                                            },
                                            {
                                                DayIdx: dIdx,
                                                ColIdx: cIdx,
                                                ColN: colN,
                                                // 枠を除外するための照合キー
                                                HolKey: dIdx * 10 + cIdx,
                                                HolTitle: h.HolTitle,
                                                Show: !IsBlank(h.HolTitle) && cIdx <= colN
                                            }
                                        )
                                    )
                                )
                            ),
                            Show
                        )
                    )
                  Text: =""
                  Visible: =false
                  Width: =1
                  X: =1132
                  Y: =756
