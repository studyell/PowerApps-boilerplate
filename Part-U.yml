      - conMain_LstU:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Width: =Parent.Width - 220
            X: =220
          Children:
            - btnBuildSubChoices_LstU:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Height: =1
                  OnSelect: |-
                    =// 選択中の大分類に属する中分類を並べ直す（先頭は「すべて」）
                    ClearCollect(colSubCatChoices, {CatName: "", SubName: "すべて", CatKey: "*"});
                    Collect(
                        colSubCatChoices,
                        ForAll(
                            Filter(colCategoryAll, カテゴリ in colCatSelected.CategoryName) As S,
                            {
                                CatName: S.カテゴリ,
                                SubName: S.サブカテゴリ,
                                CatKey: S.カテゴリ & "|" & S.サブカテゴリ
                            }
                        )
                    );
                    // 大分類が変わったので中分類は「すべて」に戻す
                    Clear(colSubCatSel2);
