            - btnResizeWeeks_UserCal:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =1
                  OnSelect: |-
                    =// ---- 休業日を日ごとに割り当てる ----
                    // 大分類・中分類が空欄なら無条件で一致とみなす
                    ClearCollect(
                        colDayHoliday,
                        ForAll(
                            colDays As D,
                            {
                                CellDate: D.CellDate,
                                // 分類の指定が無い休業日 → その日は休業日だけを表示する
                                TitleAll: LookUp(
                                    colHolidays,
                                    HolActive && HolDate = D.CellDate &&
                                        IsBlank(HolCat) && IsBlank(HolSub)
                                ).HolTitle
                            }
                        )
                    );
                    // 分類が指定された休業日のうち、選択中の大分類に該当するものだけを拾う
                    // （大分類のみの指定も、中分類指定と同じ「部分的な休業」として扱う）
                    ClearCollect(
                        colHolidayHit,
                        ForAll(
                            Filter(
                                colHolidays,
                                HolActive,
                                Not(IsBlank(HolCat)),
                                HolCat in colCatSelected.CategoryName
                            ) As Z,
                            {
                                CellDate: Z.HolDate,
                                HolTitle: Z.HolTitle,
                                HolCat: Z.HolCat,
                                HolSub: Z.HolSub
                            }
                        )
                    );
                    // ---- セルに並べるチップを確定させる（休業日 + 枠）----
                    ClearCollect(
                        colCellDisplay,
                        {
                            DayId: 0, CellDate: Today(), FrameName: "", FrameType: "",
                            Category: "", SubCategory: "",
                            ColorR: 0, ColorG: 0, ColorB: 0,
                            PublishDate: Now(), TotalSlots: 0, FullSlots: 0, CloseDaysBefore: 0,
                            CloseDate: Today(), IsClosed: false, IsFull: false, IsHoliday: false
                        }
                    );
                    Clear(colCellDisplay);
                    ForAll(
                        colDayHoliday As H,
                        If(
                            !IsBlank(H.TitleAll),
                            // 分類の指定が無い休業日 → その日は休業日だけに置き換える
                            Collect(
                                colCellDisplay,
                                {
                                    DayId: 0, CellDate: H.CellDate, FrameName: H.TitleAll, FrameType: "",
                                    Category: "", SubCategory: "",
                                    ColorR: 205, ColorG: 205, ColorB: 205,
                                    PublishDate: Blank(), TotalSlots: 0, FullSlots: 0, CloseDaysBefore: 0,
                                    CloseDate: H.CellDate, IsClosed: false, IsFull: false, IsHoliday: true
                                }
                            ),
                            // 分類が指定された休業日は該当するぶんだけ先頭に積む
                            Collect(
                                colCellDisplay,
                                ForAll(
                                    Filter(colHolidayHit, CellDate = H.CellDate) As Q,
                                    {
                                        DayId: 0, CellDate: H.CellDate, FrameName: Q.HolTitle, FrameType: "",
                                        Category: "", SubCategory: "",
                                        ColorR: 205, ColorG: 205, ColorB: 205,
                                        PublishDate: Blank(), TotalSlots: 0, FullSlots: 0, CloseDaysBefore: 0,
                                        CloseDate: H.CellDate, IsClosed: false, IsFull: false, IsHoliday: true
                                    }
                                )
                            );
                            Collect(
                                colCellDisplay,
                                ForAll(
                                    Filter(
                                        colCellFrames As G,
                                        G.CellDate = H.CellDate,
                                        Not(IsEmpty(colCatSelected)),
                                        G.Category in colCatSelected.CategoryName,
                                        // 「すべて」なら有効な分類すべて、そうでなければ選ばれた分類だけ
                                        If(
                                            varSubCatAll,
                                            (G.Category & "|" & G.SubCategory) in colValidKeys.CatKey,
                                            (G.Category & "|" & G.SubCategory) in colSubCatSel2.CatKey
                                        ),
                                        // 公開前の枠は表示しない
                                        IsBlank(G.PublishDate) || G.PublishDate <= Now(),
                                        // 休業日に当たる枠はチップを出さない（休業日に置き換える）
                                        IsEmpty(
                                            Filter(
                                                colHolidayHit,
                                                CellDate = H.CellDate,
                                                HolCat = G.Category,
                                                IsBlank(HolSub) || HolSub = G.SubCategory
                                            )
                                        )
                                    ) As F,
                                    {
                                        DayId: F.DayId, CellDate: F.CellDate, FrameName: F.FrameName,
                                        FrameType: F.FrameType, Category: F.Category, SubCategory: F.SubCategory,
                                        ColorR: F.ColorR, ColorG: F.ColorG, ColorB: F.ColorB,
                                        PublishDate: F.PublishDate, TotalSlots: F.TotalSlots,
                                        FullSlots: F.FullSlots, CloseDaysBefore: F.CloseDaysBefore,
                                        CloseDate: F.CloseDate, IsClosed: F.IsClosed, IsFull: F.IsFull,
                                        IsHoliday: false
                                    }
                                )
                            )
                        )
                    );
                    // ---- 週ごとの高さを算出 ----
                    // その週の中で最もチップが多い日の数と、当月の日を含むかを求める
                    ClearCollect(
                        colWeeksBase,
                        ForAll(
                            Sequence(6, 1) As W,
                            {
                                WeekIndex: W.Value,
                                MaxFrames: Coalesce(
                                    Max(
                                        ForAll(
                                            Filter(colDays, WeekIndex = W.Value) As D,
                                            {
                                                // セルに実際に並ぶチップ（休業日を含む）を数える
                                                N: CountRows(Filter(colCellDisplay, CellDate = D.CellDate))
                                            }
                                        ),
                                        N
                                    ),
                                    0
                                ),
                                // その週に当月の日が1日でも含まれるか（6週目の要否判定に使う）
                                HasDays: CountRows(
                                    Filter(colDays, WeekIndex = W.Value, Month(CellDate) = Month(varMonth))
                                ) > 0
                            }
                        )
                    );
                    // 表示する週数で領域を等分したものを、各週の最低高さとする
                    Set(varVisibleWeeks, Max(1, CountRows(Filter(colWeeksBase, HasDays))));
                    Set(varWeekBaseH, RoundDown(varWeeksAreaHeight / varVisibleWeeks, 0));
                    // その高さに収まるチップ数（26 は日付ラベル22px ＋ 下余白4px）
                    Set(varFitFrames, Max(0, RoundDown((varWeekBaseH - 26) / 32, 0)));
                    ClearCollect(
                        colWeeks,
                        ForAll(
                            colWeeksBase As B,
                            {
                                WeekIndex: B.WeekIndex,
                                MaxFrames: B.MaxFrames,
                                HasDays: B.HasDays,
                                // 収まらないチップの数だけ、テンプレートサイズ(32px)を足す
                                RowH: varWeekBaseH + Max(0, B.MaxFrames - varFitFrames) * 32
                            }
                        )
                    )
                  Text: =""
                  Visible: =false
                  Width: =1
                  X: =1136
                  Y: =762
