                        App.ActiveScreen = scnNoticeUser,
                        "scnNotice",
                        App.ActiveScreen = scnCalendarUser || App.ActiveScreen = scnReserveEntryUser,
                        "scnCalendarUser",
                        App.ActiveScreen = scnReservationsUser,
                        "scnMyReservations",
