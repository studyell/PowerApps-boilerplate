                                          BorderColor: =RGBA(255, 255, 255, 1)
                                          BorderThickness: =1
                                          Color: |-
                                            =With(
                                                {dim: ThisItem.IsClosed || ThisItem.ReservedCount >= ThisItem.Capacity},
                                                If(
                                                    dim,
                                                    RGBA(90, 90, 90, 1),
                                                    (ThisItem.ColorR * 299 + ThisItem.ColorG * 587 + ThisItem.ColorB * 114) / 1000 > 150,
                                                    RGBA(30, 30, 30, 1),
                                                    RGBA(255, 255, 255, 1)
                                                )
                                            )
                                          Fill: |-
                                            =With(
                                                {full: ThisItem.ReservedCount >= ThisItem.Capacity},
                                                If(
                                                    ThisItem.IsClosed,
                                                    RGBA(215, 215, 215, 1),
                                                    full,
                                                    RGBA(ThisItem.ColorR, ThisItem.ColorG, ThisItem.ColorB, 0.28),
                                                    RGBA(ThisItem.ColorR, ThisItem.ColorG, ThisItem.ColorB, 1)
                                                )
                                            )
                                          Height: =ThisItem.PosH - 5.5
                                          HoverFill: |-
                                            =With(
                                                {full: ThisItem.ReservedCount >= ThisItem.Capacity},
                                                If(
                                                    ThisItem.IsClosed,
                                                    RGBA(200, 200, 200, 1),
                                                    full,
                                                    RGBA(ThisItem.ColorR, ThisItem.ColorG, ThisItem.ColorB, 0.28),
                                                    RGBA(ThisItem.ColorR * 0.8, ThisItem.ColorG * 0.8, ThisItem.ColorB * 0.8, 1)
                                                )
                                            )
                                          OnSelect: |-
                                            =// 利用者：予約登録画面へ直行する（月表示と同じ判定）
                                            If(
                                                !IsBlank(ThisItem.PublishDate) && ThisItem.PublishDate > Now(),
                                                Notify("この枠はまだ公開されていません", NotificationType.Warning),
                                                ThisItem.IsClosed,
                                                Notify(
                                                    "この枠の受付は終了しました（受付期限 " &
                                                        Text(ThisItem.CloseDate, "yyyy/mm/dd") & "）",
                                                    NotificationType.Warning
                                                ),
                                                ThisItem.ReservedCount >= ThisItem.Capacity,
                                                Notify(
                                                    If(ThisItem.Capacity >= 2, "この枠は満員です", "この時間はすでに予約されています"),
                                                    NotificationType.Warning
                                                ),
                                                Set(varPopupDate, ThisItem.CellDate);
                                                Set(varPopupFrame, ThisItem.FrameName);
                                                Set(varPopupDayId, ThisItem.DayId);
                                                Set(varFrameTypeSel, ThisItem.FrameType);
                                                Set(varDayInfo, LookUp(予約枠日マスタ, ID = ThisItem.DayId));
                                                Set(varSelectedStart, ThisItem.StartTime);
                                                Set(varSelectedEnd, ThisItem.EndTime);
                                                Set(varSelectedSlotId, ThisItem.SlotId);
                                                Set(varSlotCapacity, ThisItem.Capacity);
                                                Set(varSlotReserved, ThisItem.ReservedCount);
                                                Set(varSlotPatternName, ThisItem.PatternName);
                                                // 連続枠の判定用に、その日の枠を控える
                                                ClearCollect(
                                                    colDaySlots4,
                                                    ForAll(
                                                        Sort(Filter(colWeekSlots, DayId = ThisItem.DayId), StartTime) As P,
                                                        {
                                                            SlotId: P.SlotId,
                                                            StartTime: P.StartTime,
                                                            EndTime: P.EndTime,
                                                            Capacity: P.Capacity,
                                                            ReservedCount: P.ReservedCount
                                                        }
                                                    )
                                                );
                                                Set(varEntryDayId, ThisItem.DayId);
                                                Set(varSlotEditLimit, ThisItem.EditLimitDate);
                                                Set(varSlotConfigJson, Coalesce(ThisItem.ConfigJson, "[]"));
                                                Set(varShowPopup, false);
                                                Set(varEntryMode, "new");
                                                Navigate(scnReserveEntryUser, ScreenTransition.Cover)
                                            )
                                          PaddingBottom: =2
                                          PaddingLeft: =4
                                          PaddingRight: =4
                                          PaddingTop: =2
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Size: =9
                                          Text: =ThisItem.TimeLabel & Char(10) & ThisItem.StatusLabel
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =ThisItem.PosW - 6
                                          X: =ThisItem.PosX + 3
                                          Y: =1
