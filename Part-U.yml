                  - lblHistEmpty:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(140, 140, 140, 1)
                        Height: =360
                        Size: =12
                        Text: ="引用できる過去の予約はありません"
                        Visible: =IsEmpty(colMyHistory)
                        Width: =600
                        X: =20
                        Y: =84
                  - btnHistApply:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        DisplayMode: =If(IsBlank(varSelHistId), DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(0, 120, 212, 1)
                        Height: =42
                        HoverFill: =RGBA(0, 100, 180, 1)
                        OnSelect: |-
                          =// 選択した過去予約の回答JSONを展開する
                          ClearCollect(
                              colHistAnswers,
                              ForAll(
                                  Table(
                                      ParseJSON(
                                          Coalesce(LookUp(colMyHistory, ID = varSelHistId).AnswerJson, "[]")
                                      )
                                  ) As J,
                                  {
                                      HLabel: Text(J.Value.Label),
                                      HKind: Text(J.Value.Kind),
                                      HValue: Text(J.Value.Value)
                                  }
                              )
                          );
                          // 引き継ぎ対象：パターン項目 ＋ 固定質問（ご利用人数）
                          // ラベルと種別が一致し、選択肢型は現在の選択肢に含まれる値だけ採用する
                          ClearCollect(
                              colCarry,
                              ForAll(
                                  Filter(
                                      colAnswers,
                                      Kind <> "section",
                                      Block = 2 || ItemKey = "fix_headcount"
                                  ) As T,
                                  With(
                                      {
                                          src: LookUp(colHistAnswers, HLabel = T.Label && HKind = T.Kind),
                                          opts: ForAll(
                                              Table(ParseJSON(Coalesce(T.Choices, "[]"))) As C,
                                              {OptVal: Text(C.Value)}
                                          )
                                      },
                                      {
                                          ItemKey: T.ItemKey,
                                          Block: T.Block,
                                          NewValue: Coalesce(src.HValue, ""),
                                          Ok: !IsBlank(src.HValue) &&
                                              (
                                                  !(T.Kind = "radio" || T.Kind = "select") ||
                                                      !IsBlank(LookUp(opts, OptVal = src.HValue))
                                              )
                                      }
                                  )
                              )
                          );
                          // ユーザーが入力する項目をいったんクリアしてから、
                          // 一致した項目だけ値を差し替えてコレクションを作り直す
                          // （見出しとロック項目＝氏名・予約枠名・利用日・利用開始時間は維持する）
                          ClearCollect(
                              colAnswersTmp,
                              ForAll(
                                  colAnswers As A,
                                  With(
                                      {
                                          c: LookUp(
                                              colCarry,
                                              ItemKey = A.ItemKey && Block = A.Block && Ok
                                          )
                                      },
                                      {
                                          ItemKey: A.ItemKey,
                                          Label: A.Label,
                                          Kind: A.Kind,
                                          Choices: A.Choices,
                                          Req: A.Req,
                                          Hint: A.Hint,
                                          Remarks: A.Remarks,
                                          Value: If(
                                              !IsBlank(c.ItemKey),
                                              c.NewValue,
                                              A.Kind <> "section" &&
                                                  !(
                                                      A.ItemKey = "fix_name_kanji" ||
                                                      A.ItemKey = "fix_frame" ||
                                                      A.ItemKey = "fix_date" ||
                                                      A.ItemKey = "fix_time" ||
                                                      A.ItemKey = "fix_editlimit"
                                                  ),
                                              "",
                                              A.Value
                                          ),
                                          Block: A.Block,
                                          SortNo: A.SortNo,
                                          Source: A.Source,
                                          FieldKey: A.FieldKey
                                      }
                                  )
                              )
                          );
                          ClearCollect(colAnswers, colAnswersTmp);
                          Notify(
                              "入力項目をクリアし、過去の予約から " &
                                  CountRows(Filter(colCarry, Ok)) & " 件を引き継ぎました" &
                                  If(
                                      CountRows(Filter(colCarry, !Ok)) > 0,
                                      "（" & CountRows(Filter(colCarry, !Ok)) &
                                          " 件はラベル・種別・選択肢が一致せずスキップ）",
                                      ""
                                  ),
                              NotificationType.Success
                          );
                          Set(varShowHistory, false)
                        Size: =12
                        Text: ="この予約から引用する"
                        Width: =180
                        X: =340
                        Y: =458
