                                                                  B.ReservedCount >= B.Capacity,
                                                                  "満員 ✕",
                                                                  "残り " & (B.Capacity - B.ReservedCount) & " 名"
                                                              ),
                                                              // 時間単位は Capacity = 1 の件数上限
                                                              If(B.ReservedCount >= B.Capacity, "予約済 ✕", "空")
                                                          ),
