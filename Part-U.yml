  scnCalendarListUser:
    Properties:
      Fill: =RGBA(250, 250, 250, 1)
      OnVisible: |-
        =// ---- 変数宣言 ----
        Set(varFramePadding, 5);
        Set(varCalendarPadding, 12);
        Set(varCalendarFrameOffset, 1);
        Set(varCalendarWeekOffset, 0.5);

        // ---- カテゴリフィルターの選択肢（大分類ラジオ / 中分類チェック） ----
        // 有効なカテゴリだけを選択肢にする
        ClearCollect(colCategoryAll, Sort(Filter(カテゴリマスタ, 有効 = true), カテゴリ));
        // 有効な「大分類｜中分類」の組み合わせ
        ClearCollect(
            colValidKeys,
            ForAll(
                colCategoryAll As V,
                {CatKey: V.カテゴリ & "|" & V.サブカテゴリ}
            )
        );
        // 大分類の選択肢（「すべて」は設けず、初期は未選択）
        ClearCollect(colCatRadio, {CategoryName: ""});
        Clear(colCatRadio);
        Collect(
            colCatRadio,
            ForAll(Distinct(colCategoryAll, カテゴリ) As C, {CategoryName: C.Value})
        );
        Set(varCatFilter, Blank());
        // 中分類の選択状態（列の型を確定させてから空にする）
        ClearCollect(colSubCatSelected, {SubCategoryName: ""});
        Clear(colSubCatSelected);
        // ---- 月表示・一覧表示の絞り込み（大分類は複数選択）----
        ClearCollect(colCatSelected, {CategoryName: ""});
        Clear(colCatSelected);
        // 中分類は「大分類｜中分類」のキーで持つ（同名の中分類を区別するため）
        ClearCollect(colSubCatSel2, {CatKey: ""});
        Clear(colSubCatSel2);
        // 中分類の選択肢（先頭が「すべて」）
        ClearCollect(colSubCatChoices, {Catname: "", SubName: "すべて", CatKey: "*"});
        // 初期状態は「すべて」を選択
        Set(varSubCatAll, true);
        // ---- カレンダーの週レイアウト設定 ----
        // 週の最低の縦幅（枠がない週はこの高さになる）
        Set(varWeekMinHeight, 90);
        // 週ギャラリーを収める領域の高さ（conWeeks の Height と揃える）
        Set(varWeeksAreaHeight, 585);
        Set(varShowPopup, false);
        // ---- 週間表示のレイアウト設定（ここを変えれば表示が変わる）----
        Set(gWeekDays, 4);           // 1画面に表示する日数
        Set(gStartMin, 8 * 60);      // 表示開始時刻（分）
        Set(gEndMin, 20 * 60);       // 表示終了時刻（分）
        Set(gStepMin, 30);           // 時間軸の刻み（分）
        Set(gRowH, 45);              // 1行の高さ
        Set(gTimeW, 60);             // 時間軸の幅
        Set(gHeadH, 52);             // ヘッダーの高さ
        Set(gMaxCols, 3);            // 1日あたりの最大列数
        Set(gSlots, Max(1, (gEndMin - gStartMin) / Max(gStepMin, 1)));
        Set(gPageMax, Max(1, 7 - gWeekDays + 1));
        Set(gPage, 1);
        // 時間軸の目盛り
        ClearCollect(
            colTimeTicks,
            ForAll(
                Sequence(gSlots, 0) As T,
                {
                    SlotIdx: T.Value + 1,
                    Slot: Right("0" & RoundDown((gStartMin + T.Value * gStepMin) / 60, 0), 2) &
                        ":" & Right("0" & Mod(gStartMin + T.Value * gStepMin, 60), 2),
                    IsHour: Mod(gStartMin + T.Value * gStepMin, 60) = 0
                }
            )
        );
        // 月表示 / 週表示の切り替え（画面間で共有する）
        If(IsBlank(varViewMode), Set(varViewMode, "month"));
        If(IsBlank(varMonth), Set(varMonth, Date(Year(Today()), Month(Today()), 1)));
        // 週の起点（日曜始まり）。初回のみ当月の1日を含む週に合わせる
        If(
            IsBlank(gWeekStart),
            Set(gWeekStart, DateAdd(varMonth, -(Weekday(varMonth) - 1), TimeUnit.Days))
        );
        // ---- カレンダー再構築 ----
        Select(btnRebuild_UserCal_LstU)
    Children:
