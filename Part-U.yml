                  Y: =44
            - btnResizeWeeks_UserCal_LstU:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =1
                  OnSelect: |-
                    =// ---- 休業日を日ごとに割り当てる ----
                    // 大分類・中分類が空欄なら無条件で一致とみなす
                    ClearCollect(
                        colDayHoliday,
                        ForAll(
                            colDays As D,
                            {
                                CellDate: D.CellDate,
                                // 分類の指定が無い休業日 → その日は休業日だけを表示する
                                TitleAll: LookUp(
                                    colHolidays,
                                    HolActive && HolDate = D.CellDate &&
                                        IsBlank(HolCat) && IsBlank(HolSub)
                                ).HolTitle
                            }
                        )
                    );
                    // 分類が指定された休業日のうち、選択中の大分類に該当するものだけを拾う
                    // （大分類のみの指定も、中分類指定と同じ「部分的な休業」として扱う）
                    ClearCollect(
                        colHolidayHit,
                        ForAll(
                            Filter(
                                colHolidays,
                                HolActive,
                                Not(IsBlank(HolCat)),
                                HolCat in colCatSelected.CategoryName
                            ) As Z,
                            {
                                CellDate: Z.HolDate,
                                HolTitle: Z.HolTitle,
                                HolCat: Z.HolCat,
                                HolSub: Z.HolSub
                            }
                        )
                    );
                    // ---- セルに並べるチップを確定させる（休業日 + 枠）----
                    ClearCollect(
                        colCellDisplay,
                        {
                            DayId: 0, CellDate: Today(), FrameName: "", FrameType: "",
                            Category: "", SubCategory: "",
                            ColorR: 0, ColorG: 0, ColorB: 0,
                            PublishDate: Now(), TotalSlots: 0, FullSlots: 0, CloseDaysBefore: 0,
                            CloseDate: Today(), IsClosed: false, IsFull: false, IsHoliday: false
                        }
                    );
                    Clear(colCellDisplay);
                    ForAll(
                        colDayHoliday As H,
                        If(
                            !IsBlank(H.TitleAll),
                            // 分類の指定が無い休業日 → その日は休業日だけに置き換える
                            Collect(
                                colCellDisplay,
                                {
                                    DayId: 0, CellDate: H.CellDate, FrameName: H.TitleAll, FrameType: "",
                                    Category: "", SubCategory: "",
                                    ColorR: 205, ColorG: 205, ColorB: 205,
                                    PublishDate: Blank(), TotalSlots: 0, FullSlots: 0, CloseDaysBefore: 0,
                                    CloseDate: H.CellDate, IsClosed: false, IsFull: false, IsHoliday: true
                                }
                            ),
                            // 分類が指定された休業日は該当するぶんだけ先頭に積む
                            Collect(
                                colCellDisplay,
                                ForAll(
                                    Filter(colHolidayHit, CellDate = H.CellDate) As Q,
                                    {
                                        DayId: 0, CellDate: H.CellDate, FrameName: Q.HolTitle, FrameType: "",
                                        Category: "", SubCategory: "",
                                        ColorR: 205, ColorG: 205, ColorB: 205,
                                        PublishDate: Blank(), TotalSlots: 0, FullSlots: 0, CloseDaysBefore: 0,
                                        CloseDate: H.CellDate, IsClosed: false, IsFull: false, IsHoliday: true
                                    }
                                )
                            );
                            Collect(
                                colCellDisplay,
                                ForAll(
                                    Filter(
                                        colCellFrames As G,
                                        G.CellDate = H.CellDate,
                                        Not(IsEmpty(colCatSelected)),
                                        G.Category in colCatSelected.CategoryName,
                                        // 「すべて」なら有効な分類すべて、そうでなければ選ばれた分類だけ
                                        If(
                                            varSubCatAll,
                                            (G.Category & "|" & G.SubCategory) in colValidKeys.CatKey,
                                            (G.Category & "|" & G.SubCategory) in colSubCatSel2.CatKey
                                        ),
                                        // 公開前の枠は表示しない
                                        IsBlank(G.PublishDate) || G.PublishDate <= Now(),
                                        // 休業日に当たる枠はチップを出さない（休業日に置き換える）
                                        IsEmpty(
                                            Filter(
                                                colHolidayHit,
                                                CellDate = H.CellDate,
                                                HolCat = G.Category,
                                                IsBlank(HolSub) || HolSub = G.SubCategory
                                            )
                                        )
                                    ) As F,
                                    {
                                        DayId: F.DayId, CellDate: F.CellDate, FrameName: F.FrameName,
                                        FrameType: F.FrameType, Category: F.Category, SubCategory: F.SubCategory,
                                        ColorR: F.ColorR, ColorG: F.ColorG, ColorB: F.ColorB,
                                        PublishDate: F.PublishDate, TotalSlots: F.TotalSlots,
                                        FullSlots: F.FullSlots, CloseDaysBefore: F.CloseDaysBefore,
                                        CloseDate: F.CloseDate, IsClosed: F.IsClosed, IsFull: F.IsFull,
                                        IsHoliday: false
                                    }
                                )
                            )
                        )
                    );
                    // ---- 週ごとの高さを算出 ----
                    // その週の中で最もチップが多い日の数と、当月の日を含むかを求める
                    ClearCollect(
                        colWeeksBase,
                        ForAll(
                            Sequence(6, 1) As W,
                            {
                                WeekIndex: W.Value,
                                MaxFrames: Coalesce(
                                    Max(
                                        ForAll(
                                            Filter(colDays, WeekIndex = W.Value) As D,
                                            {
                                                // セルに実際に並ぶチップ（休業日を含む）を数える
                                                N: CountRows(Filter(colCellDisplay, CellDate = D.CellDate))
                                            }
                                        ),
                                        N
                                    ),
                                    0
                                ),
                                // その週に当月の日が1日でも含まれるか（6週目の要否判定に使う）
                                HasDays: CountRows(
                                    Filter(colDays, WeekIndex = W.Value, Month(CellDate) = Month(varMonth))
                                ) > 0
                            }
                        )
                    );
                    // 表示する週数で領域を等分したものを、各週の最低高さとする
                    Set(varVisibleWeeks, Max(1, CountRows(Filter(colWeeksBase, HasDays))));
                    Set(varWeekBaseH, RoundDown(varWeeksAreaHeight / varVisibleWeeks, 0));
                    // その高さに収まるチップ数（26 は日付ラベル22px ＋ 下余白4px）
                    Set(varFitFrames, Max(0, RoundDown((varWeekBaseH - 26) / 32, 0)));
                    ClearCollect(
                        colWeeks,
                        ForAll(
                            colWeeksBase As B,
                            {
                                WeekIndex: B.WeekIndex,
                                MaxFrames: B.MaxFrames,
                                HasDays: B.HasDays,
                                // 収まらないチップの数だけ、テンプレートサイズ(32px)を足す
                                RowH: varWeekBaseH + Max(0, B.MaxFrames - varFitFrames) * 32
                            }
                        )
                    );


                    // ---- 一覧表示：日にち単位の枠だけ、参加人数と上限を取り直す ----
                    ClearCollect(colListSlots, {DayId: 0, Capacity: 0, ReservedCount: 0});
                    Clear(colListSlots);
                    ForAll(
                        Filter(
                            colCellDisplay,
                            Not(IsHoliday),
                            FrameType = "日にち単位",
                            CellDate >= varMonth,
                            CellDate <= varMonthEnd
                        ) As F,
                        Collect(
                            colListSlots,
                            ForAll(
                                Filter(予約枠時間マスタ, DayId = F.DayId) As S,
                                {
                                    DayId: F.DayId,
                                    Capacity: Coalesce(S.Capacity, 0),
                                    ReservedCount: Coalesce(S.ReservedCount, 0)
                                }
                            )
                        )
                    )
                  Text: =""
                  Visible: =false
                  Width: =1
                  X: =1136
                  Y: =762
            - btnRebuild_UserCal_LstU:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =1
                  OnSelect: |-
                    =// カレンダー42セル（6週分）
                    Set(varStart, DateAdd(varMonth, -(Weekday(varMonth) - 1), TimeUnit.Days));
                    Set(varRangeEnd, DateAdd(varStart, 41, TimeUnit.Days));
                    // 予約枠日マスタは当月ぶんだけ取得する（SlotDate の範囲比較は委任される）
                    Set(varMonthEnd, DateAdd(DateAdd(varMonth, 1, TimeUnit.Months), -1, TimeUnit.Days));
                    // ---- 予約データ（表示中の42日ぶんのみ取得＝委任対応） ----
                    ClearCollect(
                        colReservations,
                        ForAll(
                            Filter(予約リスト, ResDate >= varStart, ResDate <= varRangeEnd) As R,
                            {
                                ID: R.ID,
                                Title: R.Title,
                                FrameName: R.FrameName,
                                PatternName: R.パターン名,
                                ResDate: DateValue(Text(Coalesce(R.ResDate, Date(2000, 1, 1)), "yyyy/mm/dd")),
                                StartTime: R.StartTime,
                                SlotId: Coalesce(R.SlotId, 0),
                                EndTime: R.EndTime,
                                DurationMin: Coalesce(R.DurationMin, 0),
                                SlotKey: R.SlotKey,
                                Status: R.Status,
                                AnswerJson: R.回答JSON,
                                RejectReason: R.RejectReason,
                                HeadCount: R.HeadCount
                            }
                        )
                    );
                    ClearCollect(
                        colDays,
                        ForAll(
                            Sequence(42, 0) As S,
                            {
                                CellDate: DateAdd(varStart, S.Value, TimeUnit.Days),
                                WeekIndex: RoundDown(S.Value / 7, 0) + 1
                            }
                        )
                    );
                    // ---- 予約枠日マスタ（当月ぶん）----
                    ClearCollect(
                        colCellFramesRaw,
                        ForAll(
                            Filter(予約枠日マスタ, SlotDate >= varMonth, SlotDate <= varMonthEnd) As D,
                            {
                                DayId: D.ID,
                                CellDate: Coalesce(D.SlotDate, Date(2000, 1, 1)),
                                FrameName: D.Title,
                                FrameType: Coalesce(D.FrameType, "時間単位"),
                                Category: D.Category,
                                SubCategory: D.SubCategory,
                                ColorR: Coalesce(D.ColorR, 126),
                                ColorG: Coalesce(D.ColorG, 199),
                                ColorB: Coalesce(D.ColorB, 216),
                                PublishDate: D.PublishDate,
                                TotalSlots: Coalesce(D.TotalSlots, 0),
                                FullSlots: Coalesce(D.FullSlots, 0),
                                CloseDaysBefore: Coalesce(D.CloseDaysBefore, 0),
                                // 受付期限：開催日の N 日前まで受け付ける（N 日前の当日まで有効）
                                CloseDate: DateAdd(
                                    Coalesce(D.SlotDate, Date(2000, 1, 1)),
                                    -Coalesce(D.CloseDaysBefore, 0),
                                    TimeUnit.Days
                                ),
                                IsClosed: Today() >
                                    DateAdd(
                                        Coalesce(D.SlotDate, Date(2000, 1, 1)),
                                        -Coalesce(D.CloseDaysBefore, 0),
                                        TimeUnit.Days
                                    ),
                                // 満枠判定：埋まったスロット数が総スロット数に達したか
                                IsFull: Coalesce(D.TotalSlots, 0) > 0 &&
                                    Coalesce(D.FullSlots, 0) >= Coalesce(D.TotalSlots, 0)
                            }
                        )
                    );
                    // 利用者には公開済みの枠のみ表示する
                    ClearCollect(
                        colCellFrames,
                        Filter(colCellFramesRaw, IsBlank(PublishDate) || PublishDate <= Now())
                    );
                    // ---- 週の高さを算出（絞り込み結果に追従させる）----
                    // ---- 休業日マスタ（カレンダーに出す42日ぶん）----
                    ClearCollect(
                        colHolidays,
                        ForAll(
                            Filter(休業日マスタ, HolidayDate >= varStart, HolidayDate <= varRangeEnd) As H,
                            {
                                HolId: H.ID,
                                HolDate: Coalesce(H.HolidayDate, Date(2000, 1, 1)),
                                HolTitle: H.Title,
                                HolCat: H.Category,
                                HolSub: H.SubCategory,
                                HolActive: Coalesce(H.IsActive, true)
                            }
                        )
                    );
                    Select(btnResizeWeeks_UserCal_LstU)
                  Text: =""
                  Visible: =false
                  Width: =1
                  X: =1140
                  Y: =762
