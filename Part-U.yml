      - galSideMenu_Ntc:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 100
            Items: |-
              =SortByColumns(
                  Table(
                      {MenuId: 12, ParentId: 0, Level: 1, SortNo: 50, Icon: "📢", Label: "お知らせ", ScreenKey: "scnNotice"},
                      {MenuId: 1, ParentId: 0, Level: 1, SortNo: 100, Icon: "🎪", Label: "イベント参照", ScreenKey: ""},
                      {MenuId: 11, ParentId: 1, Level: 2, SortNo: 115, Icon: "📅", Label: "カレンダー", ScreenKey: "scnCalendarUser"},
                      {MenuId: 3, ParentId: 1, Level: 2, SortNo: 120, Icon: "☰", Label: "一覧", ScreenKey: "list"},
                      {MenuId: 9, ParentId: 0, Level: 1, SortNo: 400, Icon: "📋", Label: "予約一覧", ScreenKey: "scnMyReservations"}
                  ),
                  "SortNo"
              )
            OnSelect: |-
              =Switch(
                  ThisItem.ScreenKey,
                  "scnNotice", Navigate(scnNoticeUser, ScreenTransition.None),
                  "scnCalendarUser", Navigate(scnCalendarUser, ScreenTransition.None),
