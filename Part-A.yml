                                    ThisItem.Status,
                                    "予約確定", RGBA(60, 140, 40, 1),
                                    "承認待ち", RGBA(200, 110, 20, 1),
                                    "再承認待ち", RGBA(200, 110, 20, 1),
                                    "差し戻し", RGBA(200, 40, 90, 1),
                                    RGBA(120, 120, 120, 1)
                                )
                              FontWeight: =FontWeight.Semibold
