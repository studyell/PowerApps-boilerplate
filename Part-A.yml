            - btnBuildHold:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =1
                  OnSelect: |-
                    =// 押さえるスロットを組み立て、空きを確認してから保存へ進む
                    // 日にち単位：人数で判定する（新規・編集とも）
                    // 時間単位　：新規のみ、跨るすべての枠が予約済みでないかを判定する
                    //             （編集は時間を変えられず、人数も関係ないため判定しない）
                    With(
                        {
                            hc: Value(LookUp(colAnswers, ItemKey = "fix_headcount", Value)),
                            // 編集時は varDayInfo が古い値のままのことがあるため、日枠マスタから取り直す
                            ft: Coalesce(LookUp(予約枠日マスタ, ID = varEntryDayId).FrameType, "時間単位")
                        },
                        ClearCollect(
                            colHoldSlots,
                            ForAll(
                                Filter(
                                    colSlotSeq,
                                    Idx >= varStartIdx,
                                    Idx <= varStartIdx + RoundDown(varDurMin / Max(varSlotMin, 1), 0) - 1
                                ) As H,
                                {
                                    SlotId: H.SlotId,
                                    StartTime: H.StartTime,
                                    EndTime: H.EndTime,
                                    SeqNo: H.Idx - varStartIdx + 1
                                }
                            )
                        );
                        // 最新の枠情報（直前に Refresh 済み）で空きを確認する
                        ClearCollect(
                            colHoldCheck,
                            ForAll(
                                colHoldSlots As H,
                                With(
                                    {
                                        sl: LookUp(予約枠時間マスタ, ID = H.SlotId),
                                        // 編集時に自分がすでに押さえているぶん（新規は 0）
                                        mine: Coalesce(LookUp(colMyDetails, SlotId = H.SlotId).HeadCount, 0)
                                    },
                                    {
                                        SlotId: H.SlotId,
                                        StartTime: H.StartTime,
                                        // 残り人数（自分が押さえているぶんは空きとして扱う）
                                        Remain: Coalesce(sl.Capacity, 0) - (Coalesce(sl.ReservedCount, 0) - mine),
                                        Ng: If(
                                            ft = "日にち単位",
                                            IsBlank(sl.ID) ||
                                                Coalesce(sl.ReservedCount, 0) - mine + hc > Coalesce(sl.Capacity, 0),
                                            varEntryMode <> "edit",
                                            IsBlank(sl.ID) ||
                                                Coalesce(sl.ReservedCount, 0) >= Coalesce(sl.Capacity, 0),
                                            false
                                        )
                                    }
                                )
                            )
                        );
                        If(
                            CountRows(colHoldSlots) < 1,
                            Notify("利用時間を選び直してください", NotificationType.Error),
                            CountRows(Filter(colHoldCheck, Ng)) > 0,
                            If(
                                ft = "日にち単位",
                                Notify(
                                    "定員を超えるため予約できません（残り " &
                                        Max(0, Min(Filter(colHoldCheck, Ng), Remain)) & " 名）",
                                    NotificationType.Error
                                ),
                                Notify(
                                    "ほかの予約と時間が重なるため予約できません（" &
                                        Concat(
                                            Filter(colHoldCheck, Ng),
                                            Text(StartTime, "HH:mm"),
                                            " / "
                                        ) & "）",
                                    NotificationType.Error
                                )
                            ),
                            // ---- 確保できる：予約リストへ保存する ----
                            Select(btnSaveReservation)
                        )
                    )
                  Text: =""
                  Width: =1
                  X: =1134
                  Y: =762
            - btnSaveReservation:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =1
                  OnSelect: |-
                    =// 予約の本体を保存する
                    // 明細の作成・ReservedCount の加算・FullSlots の更新は Power Automate フローで行う
                    With(
                        {hc: Value(LookUp(colAnswers, ItemKey = "fix_headcount", Value))},
                        Set(
                            varSavedRes,
                            // 保存に失敗したときは空にして、下で判定する
                            IfError(
                                If(
                                    varEntryMode = "edit",
                                    Patch(
                                        予約リスト,
                                        LookUp(予約リスト, ID = varSelRes.ID),
                                        {
                                            StartTime: varSelectedStart,
                                            EndTime: varSelectedEnd,
                                            DurationMin: varDurMin,
                                            氏名: LookUp(colAnswers, ItemKey = "fix_name_kanji", Value),
                                            HeadCount: hc,
                                            回答JSON: JSON(
                                                ShowColumns(
                                                    colAnswers,
                                                    ItemKey, Label, Kind, Choices, Req, Hint, Remarks, Value, Block, SortNo, Source, FieldKey
                                                ),
                                                JSONFormat.Compact
                                            ),
                                            // 差し戻しからの再申請は「承認待ち」に戻す
                                            Status: If(varSelRes.Status = "差し戻し", "承認待ち", varSelRes.Status)
                                        }
                                    ),
                                    Patch(
                                        予約リスト,
                                        Defaults(予約リスト),
                                        {
                                            Title: varPopupFrame & "_" & Text(varPopupDate, "yyyymmdd") & "_" &
                                                Text(varSelectedStart, "HHmm"),
                                            FrameName: varPopupFrame,
                                            パターン名: varPatternName,
                                            ResDate: varPopupDate,
                                            StartTime: varSelectedStart,
                                            EndTime: varSelectedEnd,
                                            DurationMin: varDurMin,
                                            SlotId: varSelectedSlotId,
                                            // 枠名は重複しうるため、分類と日時の組み合わせをキーにする
                                            SlotKey: Coalesce(varDayInfo.Category, "") & "|" &
                                                Coalesce(varDayInfo.SubCategory, "") & "|" &
                                                Text(varPopupDate, "yyyy/mm/dd") & " " &
                                                Text(varSelectedStart, "HH:mm"),
                                            Status: "承認待ち",
                                            // 予約者の所属情報（App.OnStart で取得した gblUserInfo から）
                                            社員番号: gblUserInfo.社員番号,
                                            役職: gblUserInfo.役職,
                                            組織階層0: gblUserInfo.組織階層0,
                                            組織階層1: gblUserInfo.組織階層1,
                                            組織階層2: gblUserInfo.組織階層2,
                                            組織階層3: gblUserInfo.組織階層3,
                                            メールアドレス: gblUserInfo.メールアドレス,
                                            氏名: LookUp(colAnswers, ItemKey = "fix_name_kanji", Value),
                                            HeadCount: hc,
                                            回答JSON: JSON(
                                                ShowColumns(
                                                    colAnswers,
                                                    ItemKey, Label, Kind, Choices, Req, Hint, Remarks, Value, Block, SortNo, Source, FieldKey
                                                ),
                                                JSONFormat.Compact
                                            )
                                        }
                                    )
                                ),
                                Blank()
                            )
                        );
                        If(
                            IsBlank(varSavedRes.ID),
                            Notify(
                                "予約の保存に失敗しました。お手数ですが、もう一度お試しください",
                                NotificationType.Error
                            ),
                            // ---- 明細の作成・ReservedCount の加算・FullSlots の更新はフローで行う ----
                            // TODO: フロー名と引数の確定後、ここで '（フロー名）'.Run(...) を呼ぶ
                            Set(
                                varResFlowResult,
                                If(
                                    varEntryMode = "edit",
                                    '【新予約システム】予約更新時フロー'.Run(varSavedRes.ID),
                                    '【新予約システム】予約登録時フロー'.Run(varSavedRes.ID)
                                ).結果
                            );
                            If(
                                varResFlowResult = "正常",
                                /*'【新予約システム】予約登録・更新時通知フロー'.Run(
                                    varSavedRes.ID,
                                    If(varEntryMode = "new", "登録", "更新")
                                );*/
                                Notify(
                                    If(
                                        varEntryMode = "edit",
                                        "予約内容を更新しました",
                                        "予約を申請しました（ステータス：承認待ち）"
                                    ),
                                    NotificationType.Success
                                ),
                                varResFlowResult = "予約時間重複",
                                Notify(
                                    "予約時間が重複しています。お手数ですが、もう一度予約を取り直してください。",
                                    NotificationType.Error
                                ),
                                varResFlowResult = "人数オーバー",
                                Notify(
                                    "予約人数が超過しています。お手数ですが、もう一度予約を取り直してください。",
                                    NotificationType.Error
                                )
                            );
                            Set(varEntryMode, "new");
                            Back()
                        )
                    )
                  Text: =""
                  Width: =1
                  X: =1132
                  Y: =762
            - btnPickHistory:
