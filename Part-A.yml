  scnFramePreRegAdmin:
    Properties:
      Fill: =RGBA(250, 250, 250, 1)
      OnVisible: |-
        =Set(varFrameModePre, "");
        Set(varShowColorPopupPre, false);
        Set(varShowExpandConfirm, false);
        Set(varFrameColorRPre, 126);
        Set(varFrameColorGPre, 199);
        Set(varFrameColorBPre, 216);
        Set(varFrameCategoryPre, Blank());
        Set(varFrameSubCategoryPre, Blank());
        Set(varPublishDatePre, Today());
        Set(varPublishHourPre, 0);
        Set(varPublishMinutePre, 0);
        // カテゴリマスタ（1行1中分類）から大分類の一覧を作成
        ClearCollect(colCategoryAll, Sort(カテゴリマスタ, カテゴリ));
        ClearCollect(
            colCategory,
            ForAll(
                Distinct(colCategoryAll, カテゴリ) As C,
                {CategoryName: C.Value}
            )
        );
        // 時刻プルダウンの選択肢
        ClearCollect(colHours, ForAll(Sequence(25, 0) As H, {HourVal: H.Value}));
        ClearCollect(colMinutes, ForAll(Sequence(60, 0) As M, {MinVal: M.Value}));
        // 実施時間の分は30分単位（公開日時の分は colMinutes を使う）
        ClearCollect(colMinutes30, {MinVal: 0}, {MinVal: 30});
        // 利用曜日チェックの選択肢（順序どおり）
        ClearCollect(
            colWeekdayOptions,
            {WdName: "月"}, {WdName: "火"}, {WdName: "水"}, {WdName: "木"},
            {WdName: "金"}, {WdName: "土"}, {WdName: "日"}
        );
        ClearCollect(colWdSelectedPre, {WdName: ""});
        Clear(colWdSelectedPre);
        Set(varFrameTypePre, Blank());
        Set(varPeriodStartPre, Blank());
        Set(varPeriodEndPre, Blank());
        Set(varPreTab, "frame");
        // 例外休業日（保存前は一時的にコレクションで保持する）
        ClearCollect(colExceptDays, {ExceptDate: Today()});
        Clear(colExceptDays);
        ClearCollect(colFrameListPre, Sort(予約枠事前登録マスタ, ID));
        // パターン管理などへ移動する前に退避した入力内容があれば復元する
        If(
            Coalesce(varPreHasDraft, false),
            Set(varFrameModePre, varPreDraft.Mode);
            Set(varEditFrameIdPre, varPreDraft.EditId);
            Set(varPreTab, varPreDraft.Tab);
            Set(varFrameNamePre, varPreDraft.FrameName);
            Set(varFrameTypePre, varPreDraft.FrameType);
            Set(varPeriodStartPre, varPreDraft.PeriodStart);
            Set(varPeriodEndPre, varPreDraft.PeriodEnd);
            Set(varStartHourVPre, varPreDraft.StartHour);
            Set(varStartMinVPre, varPreDraft.StartMin);
            Set(varEndHourVPre, varPreDraft.EndHour);
            Set(varEndMinVPre, varPreDraft.EndMin);
            Set(varFrameUnitPre, varPreDraft.SlotUnit);
            Set(varFrameCapPre, varPreDraft.Capacity);
            Set(varCloseDaysPre, varPreDraft.CloseDays);
            Set(varEditDaysPre, varPreDraft.EditDays);
            Set(varFramePatternPre, varPreDraft.PatternName);
            Set(varFrameMailTmplPre, varPreDraft.MailTemplate);
            Set(varFrameActivePre, varPreDraft.IsActive);
            Set(varFrameColorRPre, varPreDraft.ColorR);
            Set(varFrameColorGPre, varPreDraft.ColorG);
            Set(varFrameColorBPre, varPreDraft.ColorB);
            Set(varFrameCategoryPre, varPreDraft.Category);
            Set(varFrameSubCategoryPre, varPreDraft.SubCategory);
            Set(varPublishDatePre, varPreDraft.PublishDate);
            Set(varPublishHourPre, varPreDraft.PublishHour);
            Set(varPublishMinutePre, varPreDraft.PublishMinute);
            ClearCollect(colWdSelectedPre, colWdDraftPre);
            ClearCollect(colExceptDays, colExceptDraftPre);
            Set(varPreHasDraft, false);
            Select(btnPreResetForm)
        )
