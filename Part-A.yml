            - btnFrameSave_Pre:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: =If(IsBlank(varFrameModePre), DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(0, 120, 212, 1)
                  Height: =48
                  OnSelect: |-
                    =With(
                        {
                            // 実施時間の総分数、枠の単位（時間単位）、定員（日にち単位）
                            totalMin: (varEndHourVPre * 60 + varEndMinVPre) - (varStartHourVPre * 60 + varStartMinVPre),
                            unit: If(ddFrameType_Pre.Selected.Value = "日にち単位", 0, Coalesce(varFrameUnitPre, 0)),
                            // 日にち単位は入力された定員（名）、時間単位は件数上限として無条件に 1
                            cap: If(
                                ddFrameType_Pre.Selected.Value = "日にち単位",
                                Value(txtCapacity_Pre.Text),
                                1
                            ),
                            // 利用曜日はカンマ区切りで保存
                            wd: Concat(colWdSelectedPre, WdName, ","),
                            // 例外休業日は yyyy-mm-dd をカンマ区切りで1列に保存
                            exd: Concat(
                                SortByColumns(colExceptDays, "ExceptDate"),
                                Text(ExceptDate, "yyyy-mm-dd"),
                                ","
                            ),
                            // 選択中パターンの構成JSONをスナップショットとして保存
                            cfg: Coalesce(
                                LookUp(
                                    パターンマスタ,
                                    パターン名 = ddFramePattern_Pre.Selected.パターン名
                                ).構成JSON,
                                ""
                            )
                        },
                        If(
                            varFrameModePre = "edit" &&
                                Coalesce(
                                    LookUp(予約枠事前登録マスタ, ID = varEditFrameIdPre).ExpandStatus,
                                    "未展開"
                                ) in ["展開中", "展開済み"],
                            Notify(
                                "この事前登録は展開中または展開済みのため編集できません。" &
                                    "新しい事前登録として登録してください",
                                NotificationType.Error
                            ),
                            IsBlank(txtFrameName_Pre.Text),
                            Notify("枠名を入力してください", NotificationType.Error),
                            IsBlank(ddFrameType_Pre.Selected.Value),
                            Notify("予約枠タイプを選択してください", NotificationType.Error),
                            IsBlank(dpPeriodStart_Pre.SelectedDate) || IsBlank(dpPeriodEnd_Pre.SelectedDate),
                            Notify("利用期間の開始日と終了日を入力してください", NotificationType.Error),
                            dpPeriodStart_Pre.SelectedDate > dpPeriodEnd_Pre.SelectedDate,
                            Notify("利用期間の開始日は終了日以前にしてください", NotificationType.Error),
                            totalMin <= 0,
                            Notify("実施時間の終了時刻は開始時刻より後にしてください", NotificationType.Error),
                            ddFrameType_Pre.Selected.Value = "時間単位" && unit < 1,
                            Notify("枠の単位（30分単位／60分単位）を選択してください", NotificationType.Error),
                            ddFrameType_Pre.Selected.Value = "時間単位" && Mod(totalMin, unit) <> 0,
                            Notify(
                                "実施時間 " & totalMin & "分 は " & unit & "分単位で割り切れません。" &
                                    "実施時間または単位を見直してください",
                                NotificationType.Error
                            ),
                            ddFrameType_Pre.Selected.Value = "日にち単位" && cap < 1,
                            Notify("定員は1以上で入力してください", NotificationType.Error),
                            IsBlank(ddFrameCategory_Pre.Selected.CategoryName),
                            Notify("大分類を選択してください", NotificationType.Error),
                            IsBlank(ddFrameSubCategory_Pre.Selected.SubCategoryName),
                            Notify("中分類を選択してください", NotificationType.Error),
                            IsBlank(ddFramePattern_Pre.Selected.パターン名),
                            Notify("入力パターンを選択してください", NotificationType.Error),
                            IsBlank(ddMailTemplate_Pre.Selected.Value),
                            Notify("メールテンプレートを選択してください", NotificationType.Error),
                            // ---- 保存 ----
                            If(
                                varFrameModePre = "new",
                                Patch(
                                    予約枠事前登録マスタ,
                                    Defaults(予約枠事前登録マスタ),
                                    {
                                        // 展開は一覧の「展開する」ボタンから Power Automate で行う
                                        ExpandStatus: "未展開",
                                        Title: txtFrameName_Pre.Text,
                                        FrameType: ddFrameType_Pre.Selected.Value,
                                        PeriodStart: dpPeriodStart_Pre.SelectedDate,
                                        PeriodEnd: dpPeriodEnd_Pre.SelectedDate,
                                        StartHour: varStartHourVPre,
                                        StartMinute: varStartMinVPre,
                                        EndHour: varEndHourVPre,
                                        EndMinute: varEndMinVPre,
                                        // 枠の単位（分）は時間単位のみ。定員は常に保存する（時間単位は 1）
                                        SlotUnitMin: If(ddFrameType_Pre.Selected.Value = "日にち単位", Blank(), unit),
                                        Capacity: cap,
                                        // 開催日の何日前まで受け付ける／変更できるか
                                        CloseDaysBefore: Max(Value(txtCloseDays_Pre.Text), 0),
                                        EditDaysBefore: Max(Value(txtEditDays_Pre.Text), 0),
                                        Weekdays: wd,
                                        ExceptDays: exd,
                                        ConfigJson: cfg,
                                        PatternName: ddFramePattern_Pre.Selected.パターン名,
                                        メールテンプレート名: ddMailTemplate_Pre.Selected.Value,
                                        IsActive: chkFrameActive_Pre.Value,
                                        ColorR: varFrameColorRPre,
                                        ColorG: varFrameColorGPre,
                                        ColorB: varFrameColorBPre,
                                        Category: ddFrameCategory_Pre.Selected.CategoryName,
                                        SubCategory: ddFrameSubCategory_Pre.Selected.SubCategoryName,
                                        // 公開日は日付＋時刻を合成して保存
                                        PublishDate: DateAdd(
                                            DateAdd(dpPublishDate_Pre.SelectedDate, varPublishHourPre, TimeUnit.Hours),
                                            varPublishMinutePre,
                                            TimeUnit.Minutes
                                        )
                                    }
                                );
                                Notify("枠「" & txtFrameName_Pre.Text & "」を登録しました", NotificationType.Success),
                                Patch(
                                    予約枠事前登録マスタ,
                                    LookUp(予約枠事前登録マスタ, ID = varEditFrameIdPre),
                                    {
                                        Title: txtFrameName_Pre.Text,
                                        FrameType: ddFrameType_Pre.Selected.Value,
                                        PeriodStart: dpPeriodStart_Pre.SelectedDate,
                                        PeriodEnd: dpPeriodEnd_Pre.SelectedDate,
                                        StartHour: varStartHourVPre,
                                        StartMinute: varStartMinVPre,
                                        EndHour: varEndHourVPre,
                                        EndMinute: varEndMinVPre,
                                        // 枠の単位（分）は時間単位のみ。定員は常に保存する（時間単位は 1）
                                        SlotUnitMin: If(ddFrameType_Pre.Selected.Value = "日にち単位", Blank(), unit),
                                        Capacity: cap,
                                        // 開催日の何日前まで受け付ける／変更できるか
                                        CloseDaysBefore: Max(Value(txtCloseDays_Pre.Text), 0),
                                        EditDaysBefore: Max(Value(txtEditDays_Pre.Text), 0),
                                        Weekdays: wd,
                                        ExceptDays: exd,
                                        ConfigJson: cfg,
                                        PatternName: ddFramePattern_Pre.Selected.パターン名,
                                        メールテンプレート名: ddMailTemplate_Pre.Selected.Value,
                                        IsActive: chkFrameActive_Pre.Value,
                                        ColorR: varFrameColorRPre,
                                        ColorG: varFrameColorGPre,
                                        ColorB: varFrameColorBPre,
                                        Category: ddFrameCategory_Pre.Selected.CategoryName,
                                        SubCategory: ddFrameSubCategory_Pre.Selected.SubCategoryName,
                                        // 公開日は日付＋時刻を合成して保存
                                        PublishDate: DateAdd(
                                            DateAdd(dpPublishDate_Pre.SelectedDate, varPublishHourPre, TimeUnit.Hours),
                                            varPublishMinutePre,
                                            TimeUnit.Minutes
                                        )
                                    }
                                );
                                Notify("枠「" & txtFrameName_Pre.Text & "」を更新しました", NotificationType.Success)
                            );
                            Set(
                                varSavedFrameId,
                                LookUp(予約枠事前登録マスタ, Title = txtFrameName_Pre.Text).ID
                            );

                            // ============================================================
                            // 展開はこの保存では行わない。一覧の「選択した事前登録を展開する」
                            // ボタン（btnExpandRun_Pre）から Power Automate を実行する。
