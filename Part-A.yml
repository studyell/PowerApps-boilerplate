                                        }
                                    );
                                    // ラベルはパターン構成のキーになるため、変更時は影響を警告する
                                    If(
                                        varOrgLabel <> lbl,
                                        Notify(
                                            "ラベルを「" & varOrgLabel & "」から「" & lbl &
                                                "」に変更しました。既存のパターン構成はこの項目を参照できなくなる場合があります",
                                            NotificationType.Warning
                                        )
                                    );
                                    Set(varOrgLabel, lbl);
                                    Notify("項目「" & lbl & "」を更新しました", NotificationType.Success)
                                );
                                ClearCollect(colAllItems, 項目マスタ)
                            )
                        )
                    )
