          Children:
            - btnBuildSubChoices_LstA:
                Control: Classic/Button@2.2.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =// 選択中の大分類に属する中分類を並べ直す（先頭は「すべて」）
                    ClearCollect(colSubCatChoices, {CatName: "", SubName: "すべて", CatKey: "*"});
                    Collect(
                        colSubCatChoices,
                        ForAll(
                            Filter(colCategoryAll, カテゴリ in colCatSelected.CategoryName) As S,
                            {
