                        ),
                        varEntryMode = "edit",
                        // ---------- 編集の保存（枠と日付は固定、利用時間は変更可） ----------
                        Refresh(予約枠時間マスタ);
                        Select(btnBuildHold),
                        // ---------- 新規登録 ----------
