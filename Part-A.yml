  scnCalendarAdmin:
    Properties:
      Fill: =RGBA(250, 250, 250, 1)
      OnVisible: |-
        =// ---- 変数宣言 ----
        Set(varFramePadding, 5);
        Set(varCalendarPadding, 12);
        Set(varCalendarFrameOffset, 1);
        Set(varCalendarWeekOffset, 0.5);

        // ---- カテゴリフィルターの選択肢（大分類ラジオ / 中分類チェック） ----
        // 有効なカテゴリだけを選択肢にする
        ClearCollect(colCategoryAll, Sort(Filter(カテゴリマスタ, 有効 = true), カテゴリ));
        // 有効な「大分類｜中分類」の組み合わせ
        ClearCollect(
            colValidKeys,
            ForAll(
                colCategoryAll As V,
                {CatKey: V.カテゴリ & "|" & V.サブカテゴリ}
            )
        );
        // 大分類の選択肢（「すべて」は設けず、初期は未選択）
        ClearCollect(colCatRadio, {CategoryName: ""});
        Clear(colCatRadio);
        Collect(
            colCatRadio,
            ForAll(Distinct(colCategoryAll, カテゴリ) As C, {CategoryName: C.Value})
        );
        Set(varCatFilter, Blank());
        // 中分類の選択状態（列の型を確定させてから空にする）
        ClearCollect(colSubCatSelected, {SubCategoryName: ""});
        Clear(colSubCatSelected);
        // ---- 月表示・一覧表示の絞り込み（大分類は複数選択）----
        ClearCollect(colCatSelected, {CategoryName: ""});
        Clear(colCatSelected);
        // 中分類は「大分類｜中分類」のキーで持つ（同名の中分類を区別するため）
        ClearCollect(colSubCatSel2, {CatKey: ""});
        Clear(colSubCatSel2);
        // 中分類の選択肢（先頭が「すべて」）
        ClearCollect(colSubCatChoices, {Catname: "", SubName: "すべて", CatKey: "*"});
        // 初期状態は「すべて」を選択
        Set(varSubCatAll, true);
        // ---- カレンダーの週レイアウト設定 ----
        // 週の最低の縦幅（枠がない週はこの高さになる）
        Set(varWeekMinHeight, 90);
        // 週ギャラリーを収める領域の高さ（conWeeks の Height と揃える）
        Set(varWeeksAreaHeight, 585);
        Set(varShowPopup, false);
        // 予約一覧から戻ってきた場合は枠情報ポップアップを復元する
        Set(varShowFrameInfo, Coalesce(varRestoreFrameInfo, false));
        Set(varRestoreFrameInfo, false);
        // ---- 週間表示のレイアウト設定（ここを変えれば表示が変わる）----
        Set(gWeekDays, 4);           // 1画面に表示する日数
        Set(gStartMin, 8 * 60);      // 表示開始時刻（分）
        Set(gEndMin, 20 * 60);       // 表示終了時刻（分）
        Set(gStepMin, 30);           // 時間軸の刻み（分）
        Set(gRowH, 45);              // 1行の高さ
        Set(gTimeW, 60);             // 時間軸の幅
        Set(gHeadH, 52);             // ヘッダーの高さ
        Set(gMaxCols, 3);            // 1日あたりの最大列数
        Set(gSlots, Max(1, (gEndMin - gStartMin) / Max(gStepMin, 1)));
        Set(gPageMax, Max(1, 7 - gWeekDays + 1));
        Set(gPage, 1);
        // 時間軸の目盛り
        ClearCollect(
            colTimeTicks,
            ForAll(
                Sequence(gSlots, 0) As T,
                {
                    SlotIdx: T.Value + 1,
                    Slot: Right("0" & RoundDown((gStartMin + T.Value * gStepMin) / 60, 0), 2) &
                        ":" & Right("0" & Mod(gStartMin + T.Value * gStepMin, 60), 2),
                    IsHour: Mod(gStartMin + T.Value * gStepMin, 60) = 0
                }
            )
        );
        // 月表示 / 週表示の切り替え（画面間で共有する）
        If(IsBlank(varViewMode), Set(varViewMode, "month"));
        If(IsBlank(varMonth), Set(varMonth, Date(Year(Today()), Month(Today()), 1)));
        // 週の起点（日曜始まり）。初回のみ当月の1日を含む週に合わせる
        If(
            IsBlank(gWeekStart),
            Set(gWeekStart, DateAdd(varMonth, -(Weekday(varMonth) - 1), TimeUnit.Days))
        );
        // ---- カレンダー再構築 ----
        Select(btnRebuild_1);
        Select(btnRebuildWeek_1);
    Children:
      - recSideBg_Cal:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            Width: =220
      - recSideBorder_Cal:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(224, 228, 233, 1)
            Height: =Parent.Height
            Width: =1
            X: =219
      - conMain_Cal:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Width: =Parent.Width - 220
            X: =220
          Children:
            - btnBuildSubChoices_M1:
                Control: Classic/Button@2.2.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =// 選択中の大分類に属する中分類を並べ直す（先頭は「すべて」）
                    ClearCollect(colSubCatChoices, {CatName: "", SubName: "すべて", CatKey: "*"});
                    Collect(
                        colSubCatChoices,
                        ForAll(
                            Filter(colCategoryAll, カテゴリ in colCatSelected.CategoryName) As S,
                            {
                                CatName: S.カテゴリ,
                                SubName: S.サブカテゴリ,
                                CatKey: S.カテゴリ & "|" & S.サブカテゴリ
                            }
                        )
                    );
                    // 大分類が変わったので中分類は「すべて」に戻す
                    Clear(colSubCatSel2);
                    Set(varSubCatAll, true);
                    Select(btnResizeWeeks_1)
                  Text: =""
                  Visible: =false
                  Width: =1
                  X: =1124
                  Y: =44
            - btnResizeWeeks_1:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =1
                  OnSelect: |-
                    =// ---- 休業日を日ごとに割り当てる ----
                    // 大分類・中分類が空欄なら無条件で一致とみなす
                    ClearCollect(
                        colDayHoliday,
                        ForAll(
                            colDays As D,
                            {
                                CellDate: D.CellDate,
                                // 分類の指定が無い休業日 → その日は休業日だけを表示する
                                TitleAll: LookUp(
                                    colHolidays,
                                    HolActive && HolDate = D.CellDate &&
                                        IsBlank(HolCat) && IsBlank(HolSub)
                                ).HolTitle
                            }
                        )
                    );
                    // 分類が指定された休業日のうち、選択中の大分類に該当するものだけを拾う
                    // （大分類のみの指定も、中分類指定と同じ「部分的な休業」として扱う）
                    ClearCollect(
                        colHolidayHit,
                        ForAll(
                            Filter(
                                colHolidays,
                                HolActive,
                                Not(IsBlank(HolCat)),
                                HolCat in colCatSelected.CategoryName
                            ) As Z,
                            {
                                CellDate: Z.HolDate,
                                HolTitle: Z.HolTitle,
                                HolCat: Z.HolCat,
                                HolSub: Z.HolSub
                            }
                        )
                    );
                    // ---- セルに並べるチップを確定させる（休業日 + 枠）----
                    ClearCollect(
                        colCellDisplay,
                        {
                            DayId: 0, CellDate: Today(), FrameName: "", FrameType: "",
                            Category: "", SubCategory: "",
                            ColorR: 0, ColorG: 0, ColorB: 0,
                            PublishDate: Now(), TotalSlots: 0, FullSlots: 0, CloseDaysBefore: 0,
                            CloseDate: Today(), IsClosed: false, IsFull: false, IsHoliday: false
                        }
                    );
                    Clear(colCellDisplay);
                    ForAll(
                        colDayHoliday As H,
                        If(
                            !IsBlank(H.TitleAll),
                            // 分類の指定が無い休業日 → その日は休業日だけに置き換える
                            Collect(
                                colCellDisplay,
                                {
                                    DayId: 0, CellDate: H.CellDate, FrameName: H.TitleAll, FrameType: "",
                                    Category: "", SubCategory: "",
                                    ColorR: 205, ColorG: 205, ColorB: 205,
                                    PublishDate: Blank(), TotalSlots: 0, FullSlots: 0, CloseDaysBefore: 0,
                                    CloseDate: H.CellDate, IsClosed: false, IsFull: false, IsHoliday: true
                                }
                            ),
                            // 分類が指定された休業日は該当するぶんだけ先頭に積む
                            Collect(
                                colCellDisplay,
                                ForAll(
                                    Filter(colHolidayHit, CellDate = H.CellDate) As Q,
                                    {
                                        DayId: 0, CellDate: H.CellDate, FrameName: Q.HolTitle, FrameType: "",
                                        Category: "", SubCategory: "",
                                        ColorR: 205, ColorG: 205, ColorB: 205,
                                        PublishDate: Blank(), TotalSlots: 0, FullSlots: 0, CloseDaysBefore: 0,
                                        CloseDate: H.CellDate, IsClosed: false, IsFull: false, IsHoliday: true
                                    }
                                )
                            );
                            Collect(
                                colCellDisplay,
                                ForAll(
                                    Filter(
                                        colCellFrames As G,
                                        G.CellDate = H.CellDate,
                                        Not(IsEmpty(colCatSelected)),
                                        G.Category in colCatSelected.CategoryName,
                                        // 「すべて」なら有効な分類すべて、そうでなければ選ばれた分類だけ
                                        If(
                                            varSubCatAll,
                                            (G.Category & "|" & G.SubCategory) in colValidKeys.CatKey,
                                            (G.Category & "|" & G.SubCategory) in colSubCatSel2.CatKey
                                        ),
                                        // 休業日に当たる枠はチップを出さない（休業日に置き換える）
                                        IsEmpty(
                                            Filter(
                                                colHolidayHit,
                                                CellDate = H.CellDate,
                                                HolCat = G.Category,
                                                IsBlank(HolSub) || HolSub = G.SubCategory
                                            )
                                        )
                                    ) As F,
                                    {
                                        DayId: F.DayId, CellDate: F.CellDate, FrameName: F.FrameName,
                                        FrameType: F.FrameType, Category: F.Category, SubCategory: F.SubCategory,
                                        ColorR: F.ColorR, ColorG: F.ColorG, ColorB: F.ColorB,
                                        PublishDate: F.PublishDate, TotalSlots: F.TotalSlots,
                                        FullSlots: F.FullSlots, CloseDaysBefore: F.CloseDaysBefore,
                                        CloseDate: F.CloseDate, IsClosed: F.IsClosed, IsFull: F.IsFull,
                                        IsHoliday: false
                                    }
                                )
                            )
                        )
                    );
                    // ---- 週ごとの高さを算出 ----
                    // その週の中で最もチップが多い日の数と、当月の日を含むかを求める
                    ClearCollect(
                        colWeeksBase,
                        ForAll(
                            Sequence(6, 1) As W,
                            {
                                WeekIndex: W.Value,
                                MaxFrames: Coalesce(
                                    Max(
                                        ForAll(
                                            Filter(colDays, WeekIndex = W.Value) As D,
                                            {
                                                // セルに実際に並ぶチップ（休業日を含む）を数える
                                                N: CountRows(Filter(colCellDisplay, CellDate = D.CellDate))
                                            }
                                        ),
                                        N
                                    ),
                                    0
                                ),
                                // その週に当月の日が1日でも含まれるか（6週目の要否判定に使う）
                                HasDays: CountRows(
                                    Filter(colDays, WeekIndex = W.Value, Month(CellDate) = Month(varMonth))
                                ) > 0
                            }
                        )
                    );
                    // 表示する週数で領域を等分したものを、各週の最低高さとする
                    Set(varVisibleWeeks, Max(1, CountRows(Filter(colWeeksBase, HasDays))));
                    Set(varWeekBaseH, RoundDown(varWeeksAreaHeight / varVisibleWeeks, 0));
                    // その高さに収まるチップ数（26 は日付ラベル22px ＋ 下余白4px）
                    Set(varFitFrames, Max(0, RoundDown((varWeekBaseH - 26) / 32, 0)));
                    ClearCollect(
                        colWeeks,
                        ForAll(
                            colWeeksBase As B,
                            {
                                WeekIndex: B.WeekIndex,
                                MaxFrames: B.MaxFrames,
                                HasDays: B.HasDays,
                                // 収まらないチップの数だけ、テンプレートサイズ(32px)を足す
                                RowH: varWeekBaseH + Max(0, B.MaxFrames - varFitFrames) * 32
                            }
                        )
                    )
                  Text: =""
                  Visible: =false
                  Width: =1
                  X: =1136
                  Y: =762
            - btnRebuild_1:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =1
                  OnSelect: |-
                    =// カレンダー42セル（6週分）
                    Set(varStart, DateAdd(varMonth, -(Weekday(varMonth) - 1), TimeUnit.Days));
                    Set(varRangeEnd, DateAdd(varStart, 41, TimeUnit.Days));
                    // 予約枠日マスタは当月ぶんだけ取得する（SlotDate の範囲比較は委任される）
                    Set(varMonthEnd, DateAdd(DateAdd(varMonth, 1, TimeUnit.Months), -1, TimeUnit.Days));
                    // ---- 予約データ（表示中の42日ぶんのみ取得＝委任対応） ----
                    ClearCollect(
                        colReservations,
                        ForAll(
                            Filter(予約リスト, ResDate >= varStart, ResDate <= varRangeEnd) As R,
                            {
                                ID: R.ID,
                                Title: R.Title,
                                FrameName: R.FrameName,
                                PatternName: R.パターン名,
                                ResDate: DateValue(Text(Coalesce(R.ResDate, Date(2000, 1, 1)), "yyyy/mm/dd")),
                                StartTime: R.StartTime,
                                SlotId: Coalesce(R.SlotId, 0),
                                EndTime: R.EndTime,
                                DurationMin: Coalesce(R.DurationMin, 0),
                                SlotKey: R.SlotKey,
                                Status: R.Status,
                                AnswerJson: R.回答JSON,
                                RejectReason: R.RejectReason,
                                HeadCount: R.HeadCount
                            }
                        )
                    );
                    ClearCollect(
                        colDays,
                        ForAll(
                            Sequence(42, 0) As S,
                            {
                                CellDate: DateAdd(varStart, S.Value, TimeUnit.Days),
                                WeekIndex: RoundDown(S.Value / 7, 0) + 1
                            }
                        )
                    );
                    // ---- 予約枠日マスタ（当月ぶん）----
                    ClearCollect(
                        colCellFrames,
                        ForAll(
                            Filter(予約枠日マスタ, SlotDate >= varMonth, SlotDate <= varMonthEnd) As D,
                            {
                                DayId: D.ID,
                                CellDate: Coalesce(D.SlotDate, Date(2000, 1, 1)),
                                FrameName: D.Title,
                                FrameType: Coalesce(D.FrameType, "時間単位"),
                                Category: D.Category,
                                SubCategory: D.SubCategory,
                                ColorR: Coalesce(D.ColorR, 126),
                                ColorG: Coalesce(D.ColorG, 199),
                                ColorB: Coalesce(D.ColorB, 216),
                                PublishDate: D.PublishDate,
                                TotalSlots: Coalesce(D.TotalSlots, 0),
                                FullSlots: Coalesce(D.FullSlots, 0),
                                CloseDaysBefore: Coalesce(D.CloseDaysBefore, 0),
                                // 受付期限：開催日の N 日前まで受け付ける（N 日前の当日まで有効）
                                CloseDate: DateAdd(
                                    Coalesce(D.SlotDate, Date(2000, 1, 1)),
                                    -Coalesce(D.CloseDaysBefore, 0),
                                    TimeUnit.Days
                                ),
                                IsClosed: Today() >
                                    DateAdd(
                                        Coalesce(D.SlotDate, Date(2000, 1, 1)),
                                        -Coalesce(D.CloseDaysBefore, 0),
                                        TimeUnit.Days
                                    ),
                                // 満枠判定：埋まったスロット数が総スロット数に達したか
                                IsFull: Coalesce(D.TotalSlots, 0) > 0 &&
                                    Coalesce(D.FullSlots, 0) >= Coalesce(D.TotalSlots, 0)
                            }
                        )
                    );
                    // ---- 週の高さを算出（絞り込み結果に追従させる）----
                    // ---- 休業日マスタ（カレンダーに出す42日ぶん）----
                    ClearCollect(
                        colHolidays,
                        ForAll(
                            Filter(休業日マスタ, HolidayDate >= varStart, HolidayDate <= varRangeEnd) As H,
                            {
                                HolId: H.ID,
                                HolDate: Coalesce(H.HolidayDate, Date(2000, 1, 1)),
                                HolTitle: H.Title,
                                HolCat: H.Category,
                                HolSub: H.SubCategory,
                                HolActive: Coalesce(H.IsActive, true)
                            }
                        )
                    );
                    Select(btnResizeWeeks_1)
                  Text: =""
                  Visible: =false
                  Width: =1
                  X: =1140
                  Y: =762
            - btnRebuildWeek_1:
                Control: Classic/Button@2.2.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =// ---- 週間表示のデータ再構築 ----
                    // 呼び出し元で gWeekStart を設定してから Select すること
                    Set(gWeekEnd, DateAdd(gWeekStart, 6, TimeUnit.Days));

                    // ---- その週の予約枠日マスタ（7日ぶんを範囲取得＝委任される）----
                    ClearCollect(
                        colWeekFrames,
                        ForAll(
                            Filter(予約枠日マスタ, SlotDate >= gWeekStart, SlotDate <= gWeekEnd) As D,
                            {
                                DayId: D.ID,
                                CellDate: Coalesce(D.SlotDate, Date(2000, 1, 1)),
                                FrameName: D.Title,
                                FrameType: Coalesce(D.FrameType, "時間単位"),
                                Category: D.Category,
                                SubCategory: D.SubCategory,
                                ColorR: Coalesce(D.ColorR, 126),
                                ColorG: Coalesce(D.ColorG, 199),
                                ColorB: Coalesce(D.ColorB, 216)
                            }
                        )
                    );

                    // ---- 日 × 枠のフラットな列リスト（1日あたり最大 gMaxCols 列）----
                    // Ungroup は使えないため、枠1行をそのまま1列として扱い、
                    // 同じ日の中での DayId 昇順の順位を列番号にする（§2.3）
                    ClearCollect(
                        colWeekCols,
                        With(
                            {
                                src: Filter(
                                    colWeekFrames,
                                    !IsBlank(varCatFilter),
                                    Category = varCatFilter,
                                    Not(IsEmpty(colSubCatSelected)),
                                    SubCategory in colSubCatSelected.SubCategoryName
                                )
                            },
                            Filter(
                                ForAll(
                                    src As F,
                                    {
                                        DayIdx: DateDiff(gWeekStart, F.CellDate, TimeUnit.Days) + 1,
                                        CellDate: F.CellDate,
                                        ColIdx: CountRows(Filter(src, CellDate = F.CellDate, DayId < F.DayId)) + 1,
                                        ColN: Min(gMaxCols, CountRows(Filter(src, CellDate = F.CellDate))),
                                        DayId: F.DayId,
                                        FrameName: F.FrameName,
                                        FrameType: F.FrameType,
                                        Category: F.Category,
                                        SubCategory: F.SubCategory,
                                        ColorR: F.ColorR,
                                        ColorG: F.ColorG,
                                        ColorB: F.ColorB
                                    }
                                ),
                                ColIdx <= gMaxCols
                            )
                        )
                    );

                    // ---- 日ヘッダー（7日ぶん。枠が無い日は列を出さない）----
                    ClearCollect(
                        colWeekDayView,
                        ForAll(
                            Sequence(7, 1) As D,
                            With(
                                {dDate: DateAdd(gWeekStart, D.Value - 1, TimeUnit.Days)},
                                With(
                                    {cols: Filter(colWeekCols, DayIdx = D.Value)},
                                    {
                                        DayIdx: D.Value,
                                        CellDate: dDate,
                                        DayName: Switch(
                                            Weekday(dDate),
                                            1, "日", 2, "月", 3, "火", 4, "水", 5, "木", 6, "金", 7, "土"
                                        ),
                                        ColN: Max(1, CountRows(cols)),
                                        HasCol: CountRows(cols) > 0,
                                        Sub1: LookUp(cols, ColIdx = 1, FrameName),
                                        Sub2: LookUp(cols, ColIdx = 2, FrameName),
                                        Sub3: LookUp(cols, ColIdx = 3, FrameName)
                                    }
                                )
                            )
                        )
                    );

                    // ---- 予約枠時間マスタ（DayId ごとに分割して取得＝1回あたりの取得数を抑える）----
                    // 先に1行入れて列の型を確定させてから空にする（§2.3）
                    ClearCollect(
                        colWeekSlots,
                        {
                            SlotId: 0,
                            DayId: 0,
                            DayIdx: 0,
                            ColIdx: 0,
                            CellDate: Today(),
                            FrameName: "",
                            FrameType: "",
                            Category: "",
                            SubCategory: "",
                            ColorR: 0,
                            ColorG: 0,
                            ColorB: 0,
                            StartTime: Now(),
                            EndTime: Now(),
                            StartMin: 0,
                            EndMin: 0,
                            Capacity: 0,
                            ReservedCount: 0,
                            PatternName: "",
                            ConfigJson: "",
                            PublishDate: Now(),
                            CloseDate: Today(),
                            EditLimitDate: Today(),
                            IsClosed: false
                        }
                    );
                    Clear(colWeekSlots);
                    ForAll(
                        colWeekCols As C,
                        Collect(
                            colWeekSlots,
                            ForAll(
                                Filter(予約枠時間マスタ, DayId = C.DayId) As S,
                                {
                                    SlotId: S.ID,
                                    DayId: C.DayId,
                                    DayIdx: C.DayIdx,
                                    ColIdx: C.ColIdx,
                                    CellDate: C.CellDate,
                                    FrameName: C.FrameName,
                                    FrameType: C.FrameType,
                                    Category: C.Category,
                                    SubCategory: C.SubCategory,
                                    ColorR: C.ColorR,
                                    ColorG: C.ColorG,
                                    ColorB: C.ColorB,
                                    StartTime: S.StartTime,
                                    EndTime: S.EndTime,
                                    StartMin: Hour(S.StartTime) * 60 + Minute(S.StartTime),
                                    EndMin: If(
                                        Hour(S.EndTime) * 60 + Minute(S.EndTime) <=
                                            Hour(S.StartTime) * 60 + Minute(S.StartTime),
                                        24 * 60,
                                        Hour(S.EndTime) * 60 + Minute(S.EndTime)
                                    ),
                                    Capacity: Coalesce(S.Capacity, 0),
                                    ReservedCount: Coalesce(S.ReservedCount, 0),
                                    PatternName: S.PatternName,
                                    ConfigJson: S.ConfigJson,
                                    PublishDate: S.PublishDate,
                                    CloseDate: DateAdd(C.CellDate, -Coalesce(S.CloseDaysBefore, 0), TimeUnit.Days),
                                    EditLimitDate: DateAdd(C.CellDate, -Coalesce(S.EditDaysBefore, 0), TimeUnit.Days),
                                    IsClosed: Today() >
                                        DateAdd(C.CellDate, -Coalesce(S.CloseDaysBefore, 0), TimeUnit.Days)
                                }
                            )
                        )
                    );


                    // ---- 休業日（その週の7日ぶん）----
                    ClearCollect(
                        colWeekHolidays,
                        ForAll(
                            Filter(休業日マスタ, HolidayDate >= gWeekStart, HolidayDate <= gWeekEnd) As H,
                            {
                                HolId: H.ID,
                                HolDate: Coalesce(H.HolidayDate, Date(2000, 1, 1)),
                                HolTitle: H.Title,
                                HolCat: H.Category,
                                HolSub: H.SubCategory,
                                HolActive: Coalesce(H.IsActive, true)
                            }
                        )
                    );
                    // ---- 日 × 列ごとに休業日を割り当てる（該当する列を丸ごと覆う）----
                    ClearCollect(
                        colWeekHolCells,
                        Filter(
                            ForAll(
                                Sequence(7 * gMaxCols, 0) As G,
                                With(
                                    {
                                        dIdx: RoundDown(G.Value / Max(gMaxCols, 1), 0) + 1,
                                        cIdx: Mod(G.Value, Max(gMaxCols, 1)) + 1
                                    },
                                    With(
                                        {
                                            dDate: DateAdd(gWeekStart, dIdx - 1, TimeUnit.Days),
                                            colN: Max(1, Coalesce(LookUp(colWeekDayView, DayIdx = dIdx, ColN), 1)),
                                            sub: LookUp(colWeekCols, DayIdx = dIdx && ColIdx = cIdx, SubCategory)
                                        },
                                        With(
                                            {
                                                h: LookUp(
                                                    colWeekHolidays,
                                                    HolActive && HolDate = dDate &&
                                                        (IsBlank(HolCat) || HolCat = varCatFilter) &&
                                                        (IsBlank(HolSub) || HolSub = sub)
                                                )
                                            },
                                            {
                                                DayIdx: dIdx,
                                                ColIdx: cIdx,
                                                ColN: colN,
                                                // 枠を除外するための照合キー
                                                HolKey: dIdx * 10 + cIdx,
                                                HolTitle: h.HolTitle,
                                                Show: !IsBlank(h.HolTitle) && cIdx <= colN
                                            }
                                        )
                                    )
                                )
                            ),
                            Show
                        )
                    )
                  Text: =""
                  Visible: =false
                  Width: =1
                  X: =1132
                  Y: =756
