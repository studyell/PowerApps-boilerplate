                      {MenuId: 4, ParentId: 0, Level: 1, SortNo: 200, Icon: "🔧", Label: "予約枠関連", ScreenKey: ""},
                      {MenuId: 5, ParentId: 4, Level: 2, SortNo: 210, Icon: "📄", Label: "項目マスタ管理", ScreenKey: "scnItemMaster"},
                      {MenuId: 6, ParentId: 4, Level: 2, SortNo: 220, Icon: "⚙", Label: "パターン管理", ScreenKey: "scnPatternAdmin"},
                      {MenuId: 7, ParentId: 4, Level: 2, SortNo: 230, Icon: "🗓", Label: "予約枠設定", ScreenKey: "scnFrameAdmin"},
                      {MenuId: 10, ParentId: 4, Level: 2, SortNo: 240, Icon: "📝", Label: "予約枠事前登録", ScreenKey: "scnFramePreRegAdmin"},
