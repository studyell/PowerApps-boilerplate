                        App.ActiveScreen = scnCalendarAdmin,
                        "scnCalendar",
                        App.ActiveScreen = scnItemMasterAdmin,
                        "scnItemMaster",
                        App.ActiveScreen = scnPatternMasterAdmin,
                        "scnPatternAdmin",
                        App.ActiveScreen = scnFrameAdmin,
                        "scnFrameAdmin",
                        App.ActiveScreen = scnFramePreRegAdmin,
                        "scnFramePreRegAdmin",
                        App.ActiveScreen = scnReservationsAdmin || App.ActiveScreen = scnReserveEntryUser,
                        "scnAdmin",
                        ""
