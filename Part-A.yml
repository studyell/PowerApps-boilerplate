                  - btnSlotSave:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(0, 120, 212, 1)
                        Height: =42
                        HoverFill: =RGBA(0, 100, 180, 1)
                        OnSelect: |-
                          =With(
                              {
                                  isDay: Coalesce(varSelDay.FrameType, "時間単位") = "日にち単位",
                                  cap: Value(txtSlotCapacity.Text),
                                  st: DateAdd(
                                      DateAdd(varSelDay.SlotDate, varSlotSH, TimeUnit.Hours),
                                      varSlotSM,
                                      TimeUnit.Minutes
                                  ),
                                  et: DateAdd(
                                      DateAdd(varSelDay.SlotDate, varSlotEH, TimeUnit.Hours),
                                      varSlotEM,
                                      TimeUnit.Minutes
                                  )
                              },
                              If(
                                  cap < 1,
                                  Notify("枠上限数は1以上で入力してください", NotificationType.Error),
                                  cap < Coalesce(varSelSlot.ReservedCount, 0),
                                  Notify(
                                      "枠上限数を現在の予約数（" & Coalesce(varSelSlot.ReservedCount, 0) &
                                          " 名）より小さくすることはできません",
                                      NotificationType.Error
                                  ),
                                  !isDay && st >= et,
                                  Notify("終了時刻は開始時刻より後にしてください", NotificationType.Error),
                                  !isDay &&
                                      CountRows(
                                          Filter(colSlotList, SlotId <> varSelSlotId, st < EndTime, et > StartTime)
                                      ) > 0,
                                  Notify(
                                      "同じ日の他の時間枠と時間帯が重なっています",
                                      NotificationType.Error
                                  ),
                                  Patch(
                                      予約枠時間マスタ,
