                  - btnExpandRun_Pre:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(16, 124, 16, 1)
                        Height: =42
                        HoverFill: =RGBA(12, 100, 12, 1)
                        OnSelect: |-
                          =// ---- 事前登録を予約枠へ展開する ----
                          Set(varExpandTargetId, varEditFrameIdPre);
                          Set(varExpandFailed, false);

                          // 先に「展開中」へ切り替え、展開ボタンを非活性にする
                          Patch(
                              予約枠事前登録マスタ,
                              LookUp(予約枠事前登録マスタ, ID = varExpandTargetId),
                              {ExpandStatus: "展開中"}
                          );

                          // Power Automate へ事前登録の ID を引き渡す（戻り値なし）
                          // 完了時の「展開済み」への更新はフロー側で行う
                          IfError(
                              '【新予約システム】予約枠展開フロー'.Run(varExpandTargetId),
                              Set(varExpandFailed, true)
                          );

                          // 起動に失敗したら「未展開」へ戻し、もう一度実行できるようにする
                          If(
                              varExpandFailed,
                              Patch(
                                  予約枠事前登録マスタ,
                                  LookUp(予約枠事前登録マスタ, ID = varExpandTargetId),
                                  {ExpandStatus: "未展開"}
                              )
                          );

                          ClearCollect(colFrameListPre, Sort(予約枠事前登録マスタ, ID));
                          Set(varShowExpandConfirm, false);
                          Notify(
                              If(
                                  varExpandFailed,
                                  "展開フローの起動に失敗しました。もう一度お試しください",
                                  "展開を開始しました。完了までカレンダーに枠は表示されません"
                              ),
                              If(varExpandFailed, NotificationType.Error, NotificationType.Success)
                          )
