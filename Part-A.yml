                    Navigate(scnCalendarAdmin, ScreenTransition.None)
                  Text: ="戻る"
                  Visible: =varFromCalendar
                  X: =1020
                  Y: =77
  scnReserveEntryUser:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      OnVisible: |-
        =// varEntryMode : "new" = 新規登録 / "edit" = 予約編集（管理者のみ）
        If(IsBlank(varEntryMode), Set(varEntryMode, "new"));
        // 「過去の予約から引用」ポップアップは常に閉じた状態で開始する
        Set(varShowHistory, false);
        Set(varSelHistId, Blank());
        Set(
            varAnswerColumns,
            "ItemKey,Label,Kind,Choices,Req,Hint,Remarks,Value,Block,SortNo,Source,FieldKey"
        );
        // ---------- 連続枠：その日の枠と、選べる利用時間を組み立てる ----------
        // 編集時は自分がすでに押さえているぶんを空きとして扱う
        ClearCollect(colMyDetails, {SlotId: 0, HeadCount: 0});
        Clear(colMyDetails);
        If(
            varEntryMode = "edit",
            Collect(
                colMyDetails,
                ForAll(
                    Filter(予約明細, ResId = varSelRes.ID) As D,
                    {SlotId: D.SlotId, HeadCount: Coalesce(D.HeadCount, 0)}
                )
            );
            // 編集は予約一覧から入るため、その日の枠をここで取得する
            Set(varEntryDayId, LookUp(予約枠時間マスタ, ID = varSelRes.SlotId).DayId);
            ClearCollect(
                colDaySlots4,
                ForAll(
                    Filter(予約枠時間マスタ, DayId = varEntryDayId) As S,
                    {
                        SlotId: S.ID,
                        StartTime: S.StartTime,
                        EndTime: S.EndTime,
                        Capacity: Coalesce(S.Capacity, 0),
                        ReservedCount: Coalesce(S.ReservedCount, 0)
                    }
                )
            );
            Set(varSelectedSlotId, varSelRes.SlotId);
            Set(varSelectedStart, varSelRes.StartTime)
        );
        // 開始スロットからの並び順に連番を振り、空き・連続性を判定しておく
        ClearCollect(
            colSlotSeq,
            With(
                {srt: Sort(colDaySlots4, StartTime)},
                ForAll(
                    Sequence(CountRows(srt)) As I,
                    With(
                        {cur: Index(srt, I.Value)},
                        {
                            Idx: I.Value,
                            SlotId: cur.SlotId,
                            StartTime: cur.StartTime,
                            EndTime: cur.EndTime,
                            // 自分が押さえているぶんは空きとして扱う
                            Vacant: cur.ReservedCount -
                                Coalesce(LookUp(colMyDetails, SlotId = cur.SlotId).HeadCount, 0) <
                                cur.Capacity,
                            // 直前の枠と時刻が連続しているか
                            Contig: I.Value = 1 ||
                                cur.StartTime = Index(srt, I.Value - 1).EndTime
                        }
                    )
                )
            )
        );
        // 選択中の枠から、この画面で使う情報を取り直す
        // （利用者カレンダーが設定していた値を、管理者アプリでは枠マスタから求める）
        Set(varSlotInfoEntry, LookUp(予約枠時間マスタ, ID = varSelectedSlotId));
        Set(varSlotPatternName, Coalesce(varSlotInfoEntry.PatternName, ""));
        Set(varSlotConfigJson, Coalesce(varSlotInfoEntry.ConfigJson, "[]"));
        Set(
            varSlotEditLimit,
            DateAdd(
                DateValue(Text(Coalesce(varSlotInfoEntry.SlotDate, Date(2000, 1, 1)), "yyyy/mm/dd")),
                -Coalesce(varSlotInfoEntry.EditDaysBefore, 0),
                TimeUnit.Days
            )
        );
        Set(varStartIdx, Coalesce(LookUp(colSlotSeq, SlotId = varSelectedSlotId, Idx), 1));
        Set(
            varSlotMin,
            Coalesce(
                DateDiff(
                    LookUp(colSlotSeq, Idx = varStartIdx).StartTime,
                    LookUp(colSlotSeq, Idx = varStartIdx).EndTime,
                    TimeUnit.Minutes
                ),
                30
            )
        );
        // 1枠ぶんから、連続して空いている範囲まで（最大480分）を選択肢にする
        ClearCollect(
            colDurOptions,
            ForAll(
                Filter(
                    ForAll(
                        Sequence(RoundDown(480 / Max(varSlotMin, 1), 0)) As N,
                        {
                            Cnt: N.Value,
                            DurMin: N.Value * varSlotMin,
                            OkVacant: CountRows(
                                Filter(
                                    colSlotSeq,
                                    Idx >= varStartIdx,
                                    Idx <= varStartIdx + N.Value - 1,
                                    Vacant
                                )
                            ),
                            OkContig: CountRows(
                                Filter(
                                    colSlotSeq,
                                    Idx > varStartIdx,
                                    Idx <= varStartIdx + N.Value - 1,
                                    Contig
                                )
                            )
                        }
                    ),
                    OkVacant = Cnt,
                    OkContig = Cnt - 1
                ) As R,
                {
                    DurMin: R.DurMin,
                    DurLabel: R.DurMin & " 分（" &
                        Text(
                            DateAdd(varSelectedStart, R.DurMin, TimeUnit.Minutes),
                            "HH:mm"
                        ) & " まで）"
                }
            )
        );
        Set(
            varDurMin,
            If(
                varEntryMode = "edit",
                Coalesce(varSelRes.DurationMin, varSlotMin),
                varSlotMin
            )
        );
        Set(varSelectedEnd, DateAdd(varSelectedStart, varDurMin, TimeUnit.Minutes));
        If(
            varEntryMode = "edit",
            // ---------- 編集モード : 回答JSONだけで画面を再構成 ----------
            ClearCollect(
                colAnswers,
                ForAll(
                    Table(ParseJSON(Coalesce(varSelRes.AnswerJson, "[]"))) As J,
                    {
                        ItemKey: Text(J.Value.ItemKey),
                        Label: Text(J.Value.Label),
                        Kind: Text(J.Value.Kind),
                        Choices: Coalesce(Text(J.Value.Choices), "[]"),
                        Req: Coalesce(Boolean(J.Value.Req), false),
                        Hint: Text(J.Value.Hint),
                        Remarks: Text(J.Value.Remarks),
                        Value: Text(J.Value.Value),
                        Block: Coalesce(Value(J.Value.Block), 2),
                        SortNo: Coalesce(Value(J.Value.SortNo), 0),
                        Source: Coalesce(Text(J.Value.Source), "pattern"),
                        FieldKey: Text(J.Value.FieldKey)
                    }
                )
            );
            Set(varPatternName, varSelRes.PatternName),
            // ---------- 新規登録 : 固定質問 + パターン展開 ----------
            Set(varPatternName, varSlotPatternName);
            // (1) 固定質問（Block = 1 / 先頭に固定表示）
            ClearCollect(
                colAnswers,
                {
                    ItemKey: "sec_yoyakusha", Label: "予約者情報", Kind: "section",
                    Choices: "[]", Req: false, Hint: "", Value: "",
                    Remarks: "", Block: 1, SortNo: 10, Source: "fixed", FieldKey: ""
                },
                {
                    ItemKey: "fix_name_kanji", Label: "氏名", Kind: "text",
                    Choices: "[]", Req: true, Hint: "", Value: gblUserInfo.氏名,
                    Remarks: "", Block: 1, SortNo: 20, Source: "fixed", FieldKey: "氏名"
                },
                {
                    ItemKey: "fix_division", Label: "所属名（支店名）", Kind: "text",
                    Choices: "[]", Req: false, Hint: "", Value: gblUserInfo.組織階層2,
                    Remarks: "", Block: 1, SortNo: 22, Source: "fixed", FieldKey: "division"
                },
                {
                    // 担当課長は App.OnStart で作った colManager（ユーザー名簿）から選ぶ
                    // 予約リストには列を持たず、回答JSONにのみ保存する
                    ItemKey: "fix_manager", Label: "担当課長", Kind: "select",
                    Choices: "[" & Concat(colManager, Char(34) & 氏名 & Char(34), ",") & "]",
                    Req: true, Hint: "", Value: "",
                    Remarks: "", Block: 1, SortNo: 23, Source: "fixed", FieldKey: ""
                },
                {
                    ItemKey: "sec_kihon", Label: "基本情報", Kind: "section",
                    Choices: "[]", Req: false, Hint: "", Value: "",
                    Remarks: "", Block: 1, SortNo: 50, Source: "fixed", FieldKey: ""
                },
                {
                    ItemKey: "fix_frame", Label: "予約枠名", Kind: "text",
                    Choices: "[]", Req: false, Hint: "", Value: varPopupFrame,
                    Remarks: "", Block: 1, SortNo: 60, Source: "fixed", FieldKey: "FrameName"
                },
                {
                    ItemKey: "fix_date", Label: "利用日", Kind: "text",
                    Choices: "[]", Req: false, Hint: "",
                    Value: Text(varPopupDate, "yyyy/mm/dd") & "(" &
                        Switch(Weekday(varPopupDate),
                            1, "日", 2, "月", 3, "火", 4, "水", 5, "木", 6, "金", 7, "土"
                        ) & ")",
                    Remarks: "", Block: 1, SortNo: 70, Source: "fixed", FieldKey: ""
                },
                {
                    ItemKey: "fix_time", Label: "利用開始時間", Kind: "text",
                    Choices: "[]", Req: false, Hint: "",
                    Value: Text(varSelectedStart, "HH:mm") & " ～ " & Text(varSelectedEnd, "HH:mm") &
                        "（" & varDurMin & "分）",
                    Remarks: "", Block: 1, SortNo: 80, Source: "fixed", FieldKey: ""
                },
                {
                    ItemKey: "fix_editlimit",
                    Label: "更新期限",
                    Kind: "text",
                    Choices: "[]",
                    Req: false,
                    Hint: "この日を過ぎると変更・取り消しができません",
                    Value: If(
                        IsBlank(varSlotEditLimit),
                        "－",
                        Text(varSlotEditLimit, "yyyy/mm/dd") & " まで"
                    ),
                    Block: 1,
                    SortNo: 85,
                    Remarks: "",
                    Source: "fixed",
                    FieldKey: ""
                },
                {
                    ItemKey: "fix_headcount", Label: "ご利用人数", Kind: "number",
                    Choices: "[]", Req: true, Hint: "半角数字で入力してください", Value: "",
                    Remarks: "", Block: 1, SortNo: 90, Source: "fixed", FieldKey: "HeadCount"
                }
            );
            // (2) パターン項目（Block = 2 / パターン管理で決めた順）
            ClearCollect(
                colAnswersRaw,
                ForAll(
                    Table(ParseJSON(Coalesce(varSlotConfigJson, "[]"))) As J,
                    {
                        ItemKey: Text(J.Value.id),
                        Label: Text(J.Value.id),
                        // 種別と選択肢は枠のスナップショットだけを見る
                        Kind: Coalesce(Text(J.Value.kind), ""),
                        Choices: Coalesce(Text(J.Value.choices), "[]"),
                        Req: Coalesce(Boolean(J.Value.req), false),
                        Hint: Text(J.Value.note),
                        Remarks: Text(J.Value.remarks),
                        Value: "",
                        Block: 2,
                        Source: "pattern",
                        FieldKey: ""
                    }
                )
            );
            // パターン内の並び順を連番で付与
            Set(varPatCount, CountRows(Filter(colAnswersRaw, !IsBlank(Kind))));
            ClearCollect(colAnswersSeq, Filter(colAnswersRaw, !IsBlank(Kind)));
            Collect(
                colAnswers,
                ForAll(
                    Sequence(varPatCount, 1) As S,
                    With(
                        {p: Index(colAnswersSeq, S.Value)},
                        {
                            ItemKey: p.ItemKey, Label: p.Label, Kind: p.Kind,
                            Choices: p.Choices, Req: p.Req, Hint: p.Hint,
                            Remarks: p.Remarks, Value: p.Value,
                            Block: 2, SortNo: S.Value * 10, Source: "pattern", FieldKey: ""
                        }
                    )
                )
            )
        );
        // ---- 利用時間（時間単位の枠のみ。ご利用人数の下に固定項目として置く）----
        If(
            Coalesce(varDayInfo.FrameType, "時間単位") = "時間単位",
            If(
                IsBlank(LookUp(colAnswers, ItemKey = "fix_duration")),
                Collect(
                    colAnswers,
                    {
                        ItemKey: "fix_duration",
                        Label: "利用時間",
                        Kind: "select",
                        Choices: "[" & Concat(colDurOptions, """" & DurLabel & """", ",") & "]",
                        Req: true,
                        Hint: If(
                            CountRows(colDurOptions) <= 1,
                            "この枠は1枠ぶんのみ予約できます",
                            "連続して空いている範囲まで選べます"
                        ),
                        Remarks: "",
