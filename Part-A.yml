                    ClearCollect(colDaySlotsFrm, Filter(予約枠時間マスタ, DayId = varSelDayId));
                    Patch(
                        予約枠日マスタ,
                        LookUp(予約枠日マスタ, ID = varSelDayId),
                        {
                            TotalSlots: CountRows(colDaySlotsFrm),
                            // 受付期限は最も遅い締切（＝日数の最小値）に合わせる
                            CloseDaysBefore: Min(colDaySlotsFrm, CloseDaysBefore),
                            FullSlots: CountRows(Filter(colDaySlotsFrm, ReservedCount >= Capacity)),
                            // 空欄（即時公開）が1件でもあれば空欄、なければ最も早い公開日
                            PublishDate: If(
                                CountRows(Filter(colDaySlotsFrm, IsBlank(PublishDate))) > 0,
                                Blank(),
                                First(Sort(colDaySlotsFrm, PublishDate)).PublishDate
                            )
                        }
                    );
                    // 一覧を取り直す
                    ClearCollect(
                        colSlotList,
                        ForAll(
                            Sort(Filter(予約枠時間マスタ, DayId = varSelDayId), StartTime) As S,
                            {
                                SlotId: S.ID,
                                StartTime: S.StartTime,
                                EndTime: S.EndTime,
                                Capacity: Coalesce(S.Capacity, 0),
                                ReservedCount: Coalesce(S.ReservedCount, 0),
                                PatternName: S.PatternName,
                                PublishDate: S.PublishDate,
                                CloseDaysBefore: Coalesce(S.CloseDaysBefore, 0),
                                EditDaysBefore: Coalesce(S.EditDaysBefore, 0)
