                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =1
                  OnSelect: |-
                    =// 予約枠日マスタを当月ぶんだけ取得する（SlotDate の範囲比較は委任される）
                    Set(
                        varFrmMonthEnd,
                        DateAdd(DateAdd(varFrmMonth, 1, TimeUnit.Months), -1, TimeUnit.Days)
                    );
                    ClearCollect(
                        colDayList,
                        ForAll(
                            Sort(
                                Filter(予約枠日マスタ, SlotDate >= varFrmMonth, SlotDate <= varFrmMonthEnd),
                                ID
                            ) As D,
                            {
                                DayId: D.ID,
                                FrameName: D.Title,
                                SlotDate: Coalesce(D.SlotDate, Date(2000, 1, 1)),
                                FrameType: Coalesce(D.FrameType, "時間単位"),
                                Category: D.Category,
                                SubCategory: D.SubCategory,
                                ColorR: Coalesce(D.ColorR, 126),
                                ColorG: Coalesce(D.ColorG, 199),
                                ColorB: Coalesce(D.ColorB, 216),
                                PublishDate: D.PublishDate,
                                TotalSlots: Coalesce(D.TotalSlots, 0),
                                FullSlots: Coalesce(D.FullSlots, 0)
                            }
                        )
                    );
                    // 枠名の絞り込み候補
                    ClearCollect(colFrmNames, {FrameName: ""});
                    Clear(colFrmNames);
                    Collect(
                        colFrmNames,
                        ForAll(Distinct(colDayList, FrameName) As N, {FrameName: N.Value})
