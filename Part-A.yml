            - btnItemSave_1:
                Control: Classic/Button@2.2.0
                Properties:
                  DisplayMode: =If(IsBlank(varItemMode), DisplayMode.Disabled, DisplayMode.Edit)
                  Height: =48
                  OnSelect: |-
                    =With(
                        {
                            lbl: Trim(txtItemLabel_1.Text),
                            grp: ddItemGroup.Selected.GroupName
                        },
                        If(
                            IsBlank(lbl),
                            Notify("ラベルを入力してください", NotificationType.Error),
                            IsBlank(grp),
                            Notify("グループを選択してください", NotificationType.Error),
                            // 同じグループ内に同じラベルがあれば弾く（自分自身は除外）
                            !IsBlank(
                                LookUp(
                                    項目マスタ,
                                    項目ラベル = lbl && グループ名 = grp && ID <> Coalesce(varEditItemId, 0)
                                )
                            ),
                            Notify(
                                "グループ「" & grp & "」には同じラベル「" & lbl & "」が既に登録されています",
                                NotificationType.Error
                            ),
                            (ddItemKind_1.Selected.Value = "radio" || ddItemKind_1.Selected.Value = "select")
                                && CountRows(
                                    Filter(
                                        Split(Substitute(txtChoices_1.Text, Char(13), ""), Char(10)),
                                        !IsBlank(Trim(Value))
                                    )
                                ) < 2,
                            Notify("radio / select の場合は選択肢を2行以上入力してください", NotificationType.Error),
                            With(
                                {
                                    cj: If(
                                        ddItemKind_1.Selected.Value = "radio" || ddItemKind_1.Selected.Value = "select",
                                        "[" & Concat(
                                            Filter(
                                                Split(Substitute(txtChoices_1.Text, Char(13), ""), Char(10)),
                                                !IsBlank(Trim(Value))
                                            ),
                                            """" & Substitute(Trim(Value), """", "") & """",
                                            ","
                                        ) & "]",
                                        ""
                                    )
                                },
                                If(
                                    varItemMode = "new",
                                    Patch(
                                        項目マスタ,
                                        Defaults(項目マスタ),
                                        {
                                            項目ラベル: lbl,
                                            項目種別: ddItemKind_1.Selected.Value,
                                            選択肢: cj,
                                            グループ名: grp,
                                            有効: chkItemActive_1.Value
                                        }
                                    );
                                    Notify("新規項目「" & lbl & "」を登録しました", NotificationType.Success);
                                    Set(varItemMode, "edit");
                                    Set(varEditItemId, LookUp(項目マスタ, 項目ラベル = lbl && グループ名 = grp).ID);
                                    Set(varOrgLabel, lbl),
                                    // ---- 更新 ----
                                    Patch(
                                        項目マスタ,
                                        LookUp(項目マスタ, ID = varEditItemId),
                                        {
