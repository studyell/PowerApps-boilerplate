            - btnAdminReload:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =1
                  OnSelect: |-
                    =// 期間の開始・終了を確定（ResDate は日付列なので比較は委任される）
                    Set(
                        varResFrom,
                        If(varResRangeMode = "future", Today(), varResMonth)
                    );
                    Set(
                        varResTo,
                        If(
                            varResRangeMode = "future",
                            DateAdd(Today(), 2, TimeUnit.Years),
                            DateAdd(DateAdd(varResMonth, 1, TimeUnit.Months), -1, TimeUnit.Days)
                        )
                    );
                    // 枠からの絞り込みに使う明細を、同じ期間ぶんだけ取得する
                    ClearCollect(
                        colFilterDetails,
                        ForAll(
                            Filter(予約明細, SlotDate >= varResFrom, SlotDate <= varResTo) As D,
                            {SlotId: D.SlotId, ResId: D.ResId}
                        )
                    );
                    ClearCollect(
                        colReservations,
                        ForAll(
                            Filter(予約リスト, ResDate >= varResFrom, ResDate <= varResTo) As R,
                            {
                                ID: R.ID,
                                Title: R.Title,
                                FrameName: R.FrameName,
                                PatternName: R.パターン名,
                                ResDate: DateValue(Text(Coalesce(R.ResDate, Date(2000, 1, 1)), "yyyy/mm/dd")),
                                StartTime: R.StartTime,
                                SlotId: Coalesce(R.SlotId, 0),
                                EndTime: R.EndTime,
                                DurationMin: Coalesce(R.DurationMin, 0),
                                SlotKey: R.SlotKey,
                                Status: R.Status,
                                氏名: R.氏名,
                                AnswerJson: R.回答JSON,
                                // 予約登録日時（SharePoint の作成日時）
                                CreatedAt: R.登録日時,
                                // 所属名（支店名）、職種、役職
                                組織階層2: R.組織階層2,
                                組織階層3: R.組織階層3,
                                役職: R.役職,
                                // 回答JSONから随行社員氏名を1回だけ取り出しておく
                                随行社員氏名: Coalesce(
                                    LookUp(
                                        ForAll(
                                            Table(ParseJSON(Coalesce(R.回答JSON, "[]"))) As J,
                                            {Key: Text(J.Value.ItemKey), Val: Text(J.Value.Value)}
                                        ),
                                        Key = "随行社員①　氏名",
                                        Val
                                    ),
                                    ""
                                ),
                                RejectReason: R.RejectReason,
                                HeadCount: R.HeadCount
                            }
                        )
                    )
                  Text: =""
                  Width: =1
                  X: =1140
                  Y: =762
